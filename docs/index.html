<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7c3aed">
<title>Society Directory</title>
<style>
/* ============================ palette ============================ */
:root{
  --bg:#f6f7fd;
  --surface:#ffffff;
  --surface-2:#f1f3fb;
  --text:#14162b;
  --text-2:#474c6b;
  --muted:#7b81a3;
  --border:#e6e9f7;
  --border-2:#d3d8ee;

  --violet:#7c3aed;  --violet-2:#a855f7;
  --pink:#ec4899;
  --orange:#f97316;  --amber:#f59e0b;
  --emerald:#10b981;
  --cyan:#06b6d4;
  --blue:#3b82f6;
  --rose:#f43f5e;

  /* per-section tone, overridden inline */
  --tone:#7c3aed; --tone-2:#a855f7;
  --tone-soft:#f3ecff;

  --r:18px; --r-sm:12px; --r-lg:26px;
  --sh:0 2px 4px rgba(20,22,43,.04), 0 12px 28px -14px rgba(20,22,43,.18);
  --sh-hi:0 8px 18px rgba(20,22,43,.10), 0 26px 50px -18px rgba(124,58,237,.34);
  --tap:46px;
}
:root[data-theme="dark"]{
  --bg:#0a0b14; --surface:#141628; --surface-2:#1c1f36;
  --text:#f0f1fa; --text-2:#c0c4e0; --muted:#8f95bb;
  --border:#252943; --border-2:#343a5c;
  --tone-soft:#241b3d;
  --sh:0 2px 4px rgba(0,0,0,.5), 0 12px 28px -14px rgba(0,0,0,.8);
  --sh-hi:0 8px 18px rgba(0,0,0,.55), 0 26px 50px -18px rgba(124,58,237,.5);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
@media(min-width:700px){ .wrap{padding:0 24px} }

/* ============================ hero ============================ */
.hero{
  position:relative;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,#6d28d9 0%,#a21caf 42%,#db2777 70%,#f97316 100%);
  padding-top:env(safe-area-inset-top);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(50% 70% at 12% 8%, rgba(255,255,255,.34), transparent 62%),
    radial-gradient(45% 60% at 88% 96%, rgba(56,189,248,.40), transparent 65%);
}
.hero-in{
  position:relative;z-index:1;max-width:1060px;margin:0 auto;
  padding:26px 16px 30px;display:flex;align-items:flex-start;gap:15px;
}
@media(min-width:700px){ .hero-in{padding:38px 24px 42px;gap:20px;align-items:center} }
.crest{
  width:58px;height:58px;flex:none;border-radius:19px;display:grid;place-items:center;
  font-size:25px;font-weight:800;letter-spacing:-.04em;color:#7c3aed;
  background:rgba(255,255,255,.96);
  box-shadow:0 8px 22px rgba(0,0,0,.22), inset 0 -2px 0 rgba(124,58,237,.14);
}
@media(min-width:700px){ .crest{width:72px;height:72px;border-radius:23px;font-size:31px} }
.crest img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.hero h1{
  margin:0;font-weight:800;letter-spacing:-.04em;line-height:1.1;
  font-size:clamp(23px,6.2vw,40px);text-shadow:0 2px 14px rgba(0,0,0,.22);
}
.hero .sub{
  color:rgba(255,255,255,.92);font-size:13.5px;margin-top:5px;font-weight:500;
  text-shadow:0 1px 8px rgba(0,0,0,.25);
}
@media(min-width:700px){ .hero .sub{font-size:15px} }
.badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  padding:5px 13px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.22);color:#fff;
  border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;
  box-shadow:0 0 0 3px rgba(74,222,128,.35)}
.spacer{flex:1}
.icon-btn{
  width:var(--tap);height:var(--tap);flex:none;display:grid;place-items:center;cursor:pointer;
  border-radius:14px;font-size:19px;line-height:1;color:#fff;
  background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(8px);transition:.18s;-webkit-tap-highlight-color:transparent;
}
.icon-btn:active{transform:scale(.93)}
.icon-btn:hover{background:rgba(255,255,255,.32)}

/* ============================ stats ============================ */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-width:1060px;margin:-20px auto 0;padding:0 16px;position:relative;z-index:5;
}
@media(min-width:700px){ .stats{padding:0 24px;gap:16px;margin-top:-28px} }
.stat{
  border-radius:var(--r-sm);padding:13px 10px;text-align:center;color:#fff;
  box-shadow:var(--sh);background:linear-gradient(140deg,var(--tone),var(--tone-2));
}
@media(min-width:700px){ .stat{padding:18px 14px;border-radius:var(--r)} }
.stat .n{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
@media(min-width:700px){ .stat .n{font-size:31px} }
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  opacity:.94;margin-top:2px}
@media(min-width:700px){ .stat .l{font-size:11.5px} }

/* ============================ sections ============================ */
main{padding:26px 0 calc(60px + env(safe-area-inset-bottom))}
section{margin-bottom:30px;animation:rise .5s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sec-head{display:flex;align-items:center;gap:11px;margin:0 0 14px}
.sec-ico{
  width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-size:16px;color:#fff;background:linear-gradient(140deg,var(--tone),var(--tone-2));
  box-shadow:0 5px 13px -4px var(--tone);
}
.sec-head h2{margin:0;font-size:17.5px;font-weight:800;letter-spacing:-.03em;flex:1}
@media(min-width:700px){ .sec-head h2{font-size:20px} }
.pill{
  font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;
  background:var(--tone-soft);color:var(--tone);
}
:root[data-theme="dark"] .pill{color:var(--tone-2)}

.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:560px){ .grid{grid-template-columns:repeat(auto-fill,minmax(268px,1fr))} }

/* ============================ cards ============================ */
.card{
  position:relative;display:flex;gap:13px;align-items:flex-start;overflow:hidden;
  background:var(--surface);border-radius:var(--r);padding:15px 15px 15px 18px;
  box-shadow:var(--sh);transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--tone),var(--tone-2));
}
@media(hover:hover){ .card:hover{transform:translateY(-4px);box-shadow:var(--sh-hi)} }
.card:active{transform:scale(.99)}

.av{
  width:48px;height:48px;flex:none;border-radius:15px;display:grid;place-items:center;
  font-weight:800;font-size:16.5px;letter-spacing:-.03em;color:#fff;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.13);
}
.body{min-width:0;flex:1}
.role{
  display:inline-block;margin-bottom:5px;font-size:10.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--tone);
  background:var(--tone-soft);padding:3px 9px;border-radius:7px;
}
:root[data-theme="dark"] .role{color:var(--tone-2)}
.nm{font-weight:750;letter-spacing:-.02em;font-size:16.5px;line-height:1.3}
.meta{color:var(--muted);font-size:13.5px;margin-top:3px;font-weight:500}

.contact-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:40px;padding:0 15px;border-radius:11px;text-decoration:none;
  font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;
  color:#fff;background:linear-gradient(140deg,var(--tone),var(--tone-2));
  box-shadow:0 5px 13px -5px var(--tone);transition:.16s;
  -webkit-tap-highlight-color:transparent;
}
.chip:active{transform:scale(.96)}
.chip.mail{background:var(--surface-2);color:var(--text-2);box-shadow:none}
.chip svg{width:15px;height:15px;flex:none}
@media(max-width:559px){ .chip{flex:1 1 auto} }

/* emergency: full-bleed vivid */
.card.sos{background:linear-gradient(140deg,#f43f5e,#f97316);color:#fff}
.card.sos::before{display:none}
.card.sos .av{background:rgba(255,255,255,.25)!important;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.card.sos .role{background:rgba(255,255,255,.24);color:#fff}
.card.sos .meta{color:rgba(255,255,255,.9)}
.card.sos .chip{background:#fff;color:#e11d48;box-shadow:0 5px 13px -5px rgba(0,0,0,.4)}
.card.sos .chip.mail{background:rgba(255,255,255,.22);color:#fff}

/* ============================ search ============================ */
.toolbar{
  position:sticky;top:0;z-index:30;margin:0 -16px 14px;padding:11px 16px;
  background:var(--bg); /* fallback where color-mix is unsupported */
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
@media(min-width:700px){ .toolbar{margin:0 -24px 16px;padding:12px 24px} }
.toolbar.stuck{border-bottom-color:var(--border)}
.search{position:relative;display:flex;align-items:center}
.search>svg{position:absolute;left:15px;width:18px;height:18px;color:var(--muted);pointer-events:none}
input[type=search],input[type=text]{
  width:100%;font:inherit;font-size:16px;color:var(--text);min-height:var(--tap);
  background:var(--surface);border:2px solid var(--border);border-radius:14px;
  padding:10px 14px 10px 44px;transition:.18s;box-shadow:var(--sh);
}
input::placeholder{color:var(--muted)}
input:focus{outline:none;border-color:var(--violet);
  box-shadow:0 0 0 4px rgba(124,58,237,.18)}

.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.fchip{
  font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;
  min-height:38px;padding:0 16px;border-radius:999px;transition:.16s;flex:none;
  background:var(--surface);color:var(--text-2);border:2px solid var(--border);
  -webkit-tap-highlight-color:transparent;
}
.fchip:active{transform:scale(.95)}
.fchip[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--violet),var(--pink));
  color:#fff;border-color:transparent;box-shadow:0 6px 15px -5px var(--violet);
}
.result-note{color:var(--muted);font-size:13.5px;margin:4px 0 12px;font-weight:600}

/* ============================ states ============================ */
.panel{
  background:var(--surface);border-radius:var(--r-lg);padding:34px 22px;
  text-align:center;box-shadow:var(--sh);max-width:460px;margin:34px auto;
}
.panel .big{font-size:44px;margin-bottom:12px;line-height:1}
.panel h3{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:-.03em}
.panel p{margin:0;color:var(--muted);font-size:14.5px}
.panel .search{margin-top:20px}
.panel input{padding-left:14px;text-align:center}
.btn{
  margin-top:11px;width:100%;font:inherit;font-size:16px;font-weight:800;cursor:pointer;
  color:#fff;border:none;border-radius:14px;min-height:var(--tap);padding:12px 18px;
  background:linear-gradient(140deg,var(--violet),var(--pink));
  box-shadow:0 8px 20px -6px var(--violet);transition:.18s;
}
.btn:active{transform:scale(.97)}
.empty{color:var(--muted);font-size:14.5px;padding:30px 20px;text-align:center;
  border:2px dashed var(--border-2);border-radius:var(--r);font-weight:600}
.sk{border-radius:var(--r);height:82px;
  background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);
  background-size:220% 100%;animation:shim 1.3s ease-in-out infinite;box-shadow:var(--sh)}
@keyframes shim{from{background-position:150% 0}to{background-position:-50% 0}}
footer{color:var(--muted);font-size:12.5px;text-align:center;
  padding:0 16px calc(34px + env(safe-area-inset-bottom));font-weight:600}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-in">
    <div class="crest" id="crest">·</div>
    <div style="min-width:0;flex:1">
      <h1 id="socName">Loading…</h1>
      <div class="sub" id="socSub"></div>
      <div id="scopeTag"></div>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</div>
<div class="stats" id="stats"></div>

<main class="wrap" id="app">
  <div class="grid" style="margin-top:20px">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
</main>
<footer id="foot"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  // Safe to publish: every table has RLS on with no policies, so this key
  // reaches nothing but get_directory(), which enforces scope server-side.
  var SUPABASE_URL = "https://axrphdcjvwzpcqmorbgw.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4cnBoZGNqdnd6cGNxbW9yYmd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NjkxNTYsImV4cCI6MjEwMjQ0NTE1Nn0.o_PUwx1Y5bbkUPP7SxuDqhpT-04X3jxJmov3RdjKB3k";

  var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var app = document.getElementById("app");
  var data = null;

  /* -------- theme: bright by default; dark only if explicitly chosen -------- */
  try {
    if (localStorage.getItem("dir-theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) {}
  document.getElementById("themeBtn").onclick = function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    if (dark) document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", "dark");
    try { localStorage.setItem("dir-theme", dark ? "light" : "dark"); } catch (e) {}
    document.querySelector('meta[name=theme-color]')
      .setAttribute("content", dark ? "#7c3aed" : "#0a0b14");
  };

  /* ---------------- colour tones ---------------- */
  var TONES = {
    committee:  ["#7c3aed", "#a855f7", "#f3ecff", "★"],
    residents:  ["#3b82f6", "#06b6d4", "#e8f2ff", "🏠"],
    emergency:  ["#f43f5e", "#f97316", "#ffe9ec", "🚨"],
    maintenance:["#f97316", "#f59e0b", "#fff0e2", "🔧"],
    utilities:  ["#06b6d4", "#22d3ee", "#e2f8fc", "💡"],
    office:     ["#10b981", "#34d399", "#e3f9f1", "🏢"],
    general:    ["#8b5cf6", "#d946ef", "#f4ecff", "📇"]
  };
  function toneFor(name) {
    var k = String(name || "").toLowerCase();
    if (k.indexOf("emerg") > -1) return TONES.emergency;
    if (k.indexOf("mainten") > -1 || k.indexOf("repair") > -1) return TONES.maintenance;
    if (k.indexOf("utilit") > -1) return TONES.utilities;
    if (k.indexOf("office") > -1 || k.indexOf("admin") > -1) return TONES.office;
    if (k.indexOf("committee") > -1) return TONES.committee;
    if (k.indexOf("resident") > -1) return TONES.residents;
    return TONES.general;
  }
  function applyTone(node, tone) {
    node.style.setProperty("--tone", tone[0]);
    node.style.setProperty("--tone-2", tone[1]);
    node.style.setProperty("--tone-soft", tone[2]);
  }

  /* ---------------- dom helpers ---------------- */
  // Built as nodes with textContent — never innerHTML with member data.
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null && text !== "") n.textContent = text;
    return n;
  }
  var ICON = {
    phone: "M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z",
    mail: "M3 5h18v14H3V5zm2 2v.5l7 4.5 7-4.5V7H5zm0 2.9V17h14V9.9l-7 4.5-7-4.5z",
    search: "M10 3a7 7 0 105.3 11.6l4 4 1.4-1.4-4-4A7 7 0 0010 3zm0 2a5 5 0 110 10 5 5 0 010-10z"
  };
  function svg(path) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "currentColor");
    s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", path);
    s.appendChild(p);
    return s;
  }
  function hue(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }
  function initials(name) {
    var parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }
  function avatar(name) {
    var a = el("div", "av", initials(name));
    var h = hue(String(name || ""));
    a.style.background = "linear-gradient(140deg,hsl(" + h + " 82% 58%),hsl(" +
                         ((h + 42) % 360) + " 85% 64%))";
    return a;
  }

  /* ---------------- card ---------------- */
  function card(p, sos) {
    var c = el("div", "card" + (sos ? " sos" : ""));
    var display = p.name || p.label || "—";
    c.appendChild(avatar(display));

    var b = el("div", "body");
    var top = p.role || (p.name ? p.label : null);
    if (top) b.appendChild(el("span", "role", top));
    b.appendChild(el("div", "nm", display));

    var sub = [p.flat_no, p.notes].filter(Boolean).join(" · ");
    if (sub) b.appendChild(el("div", "meta", sub));

    var row = el("div", "contact-row");
    [p.phone, p.alt_phone].filter(Boolean).forEach(function (num) {
      var a = el("a", "chip");
      a.href = "tel:" + String(num).replace(/[^\d+]/g, "");
      a.appendChild(svg(ICON.phone));
      a.appendChild(el("span", null, num));
      row.appendChild(a);
    });
    if (p.email) {
      var m = el("a", "chip mail");
      m.href = "mailto:" + p.email;
      m.appendChild(svg(ICON.mail));
      m.appendChild(el("span", null, "Email"));
      row.appendChild(m);
    }
    if (row.childNodes.length) b.appendChild(row);
    c.appendChild(b);
    return c;
  }

  function section(title, count, tone) {
    var s = el("section");
    applyTone(s, tone);
    var h = el("div", "sec-head");
    h.appendChild(el("div", "sec-ico", tone[3]));
    h.appendChild(el("h2", null, title));
    if (count != null) h.appendChild(el("span", "pill", String(count)));
    s.appendChild(h);
    return s;
  }
  function gridOf(items, sos) {
    var g = el("div", "grid");
    items.forEach(function (i) { g.appendChild(card(i, sos)); });
    return g;
  }

  /* ---------------- header + stats ---------------- */
  function renderHead(s, scope) {
    document.getElementById("socName").textContent = s.name || "Society Directory";
    document.title = s.name || "Society Directory";

    var bits = [s.address, s.city, s.pincode].filter(Boolean).join(", ");
    if (s.tagline) bits = bits ? s.tagline + " · " + bits : s.tagline;
    document.getElementById("socSub").textContent = bits;

    var crest = document.getElementById("crest");
    crest.textContent = "";
    if (s.logo_url) {
      var img = document.createElement("img");
      img.src = s.logo_url; img.alt = "";
      img.onerror = function () {
        crest.textContent = (s.name || "S").trim().charAt(0).toUpperCase();
      };
      crest.appendChild(img);
    } else {
      crest.textContent = (s.name || "S").trim().charAt(0).toUpperCase();
    }

    var tag = document.getElementById("scopeTag");
    tag.textContent = "";
    var t = el("span", "badge");
    t.appendChild(el("span", "dot"));
    t.appendChild(el("span", null, scope === "residents" ? "Residents view" : "Public view"));
    tag.appendChild(t);

    document.getElementById("foot").textContent =
      s.registration_no ? "Reg. " + s.registration_no : "";
  }

  function renderStats() {
    var box = document.getElementById("stats");
    box.textContent = "";
    var cells = [];
    if (data.scope === "residents") {
      cells.push([data.members.length, "Residents", TONES.residents]);
    }
    cells.push([data.committee.length, "Committee", TONES.committee]);
    cells.push([data.contacts.length, "Contacts", TONES.office]);

    box.style.gridTemplateColumns = "repeat(" + cells.length + ",1fr)";
    cells.forEach(function (c) {
      var d = el("div", "stat");
      applyTone(d, c[2]);
      d.appendChild(el("div", "n", String(c[0])));
      d.appendChild(el("div", "l", c[1]));
      box.appendChild(d);
    });
  }

  /* ---------------- residents ---------------- */
  function renderMembers() {
    if (data.scope !== "residents") return null;
    var tone = TONES.residents;
    var s = section("Residents", data.members.length, tone);
    if (!data.members.length) {
      s.appendChild(el("div", "empty", "No residents recorded yet."));
      return s;
    }

    var blocks = [];
    data.members.forEach(function (m) {
      if (m.block && blocks.indexOf(m.block) === -1) blocks.push(m.block);
    });
    blocks.sort();

    var bar = el("div", "toolbar");
    var sw = el("div", "search");
    sw.appendChild(svg(ICON.search));
    var q = document.createElement("input");
    q.type = "search";
    q.placeholder = "Search name, flat or phone…";
    sw.appendChild(q);
    bar.appendChild(sw);

    var active = "";
    if (blocks.length > 1) {
      var chips = el("div", "chips");
      [""].concat(blocks).forEach(function (b) {
        var btn = el("button", "fchip", b ? "Block " + b : "All");
        btn.setAttribute("aria-pressed", b === active ? "true" : "false");
        btn.onclick = function () {
          active = b;
          Array.prototype.forEach.call(chips.children, function (x) {
            x.setAttribute("aria-pressed", "false");
          });
          btn.setAttribute("aria-pressed", "true");
          draw();
        };
        chips.appendChild(btn);
      });
      bar.appendChild(chips);
    }
    s.appendChild(bar);

    var note = el("div", "result-note");
    var grid = el("div", "grid");
    s.appendChild(note);
    s.appendChild(grid);

    function draw() {
      var term = q.value.trim().toLowerCase();
      var hits = data.members.filter(function (m) {
        if (active && m.block !== active) return false;
        if (!term) return true;
        return [m.name, m.flat_no, m.block, m.phone, m.email, m.role]
          .filter(Boolean).join(" ").toLowerCase().indexOf(term) !== -1;
      });

      grid.textContent = "";
      hits.forEach(function (m) {
        grid.appendChild(card({
          name: m.name, role: m.role,
          flat_no: [m.block, m.flat_no].filter(Boolean).join("-"),
          phone: m.phone, email: m.email
        }, false));
      });

      if (!hits.length) {
        grid.appendChild(el("div", "empty", "Nobody matches that search."));
        note.textContent = "";
      } else {
        note.textContent = hits.length === data.members.length
          ? data.members.length + " residents"
          : "Showing " + hits.length + " of " + data.members.length;
      }
    }
    q.addEventListener("input", draw);
    draw();

    requestAnimationFrame(function () {
      var io = new IntersectionObserver(function (en) {
        bar.classList.toggle("stuck", en[0].intersectionRatio < 1);
      }, { threshold: [1] });
      io.observe(bar);
    });
    return s;
  }

  /* ---------------- render ---------------- */
  function render() {
    renderHead(data.society, data.scope);
    renderStats();
    app.textContent = "";

    if (data.committee.length) {
      var s1 = section("Committee", data.committee.length, TONES.committee);
      s1.appendChild(gridOf(data.committee, false));
      app.appendChild(s1);
    }

    var sos = data.contacts.filter(function (c) { return c.is_emergency; });
    if (sos.length) {
      var s2 = section("Emergency", sos.length, TONES.emergency);
      s2.appendChild(gridOf(sos, true));
      app.appendChild(s2);
    }

    var rest = data.contacts.filter(function (c) { return !c.is_emergency; });
    var groups = {}, order = [];
    rest.forEach(function (c) {
      var k = c.category || "General";
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(c);
    });
    order.forEach(function (k) {
      var s3 = section(k, groups[k].length, toneFor(k));
      s3.appendChild(gridOf(groups[k], false));
      app.appendChild(s3);
    });

    var mem = renderMembers();
    if (mem) app.appendChild(mem);

    if (!app.childNodes.length) {
      panel("📋", "Nothing published yet",
        "This directory has no entries. Add them in the admin tool, then reload.");
    }
  }

  /* ---------------- states ---------------- */
  function panel(emoji, title, body, withInput) {
    document.getElementById("stats").textContent = "";
    app.textContent = "";
    var p = el("div", "panel");
    p.appendChild(el("div", "big", emoji));
    p.appendChild(el("h3", null, title));
    p.appendChild(el("p", null, body));
    if (withInput) {
      var sw = el("div", "search");
      var inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "Paste your link or token";
      try { inp.value = localStorage.getItem("dir-token") || ""; } catch (e) {}
      sw.appendChild(inp);
      p.appendChild(sw);
      var go = el("button", "btn", "Open directory");
      go.onclick = function () {
        var v = extract(inp.value);
        if (!v) { inp.focus(); return; }
        try { localStorage.setItem("dir-token", v); } catch (e) {}
        location.hash = v;
        location.reload();
      };
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go.click(); });
      p.appendChild(go);
    }
    app.appendChild(p);
    if (withInput) p.querySelector("input").focus();
  }

  function extract(raw) {
    raw = (raw || "").trim();
    var m = raw.match(/[?&#]t=([^&\s]+)/);
    if (m) return decodeURIComponent(m[1]);
    m = raw.match(/#([A-Za-z0-9_-]{8,})\s*$/);
    return m ? m[1] : raw;
  }
  function token() {
    var p = new URLSearchParams(location.search).get("t");
    if (p) return p.trim();
    if (location.hash.length > 1) return location.hash.slice(1).trim();
    return "";
  }

  /* ---------------- load ---------------- */
  var t = extract(token());
  if (!t) {
    document.getElementById("socName").textContent = "Society Directory";
    panel("🔑", "Open your directory",
      "Paste the share link you were given. It is remembered on this device.", true);
    return;
  }

  db.rpc("get_directory", { p_token: t }).then(function (res) {
    if (res.error) {
      document.getElementById("socName").textContent = "Society Directory";
      if (/find the function|does not exist|schema cache/i.test(res.error.message || "")) {
        panel("🛠", "Database not set up yet",
          "Run supabase/migration.sql in the Supabase SQL Editor, then reload.");
      } else {
        panel("⚠️", "Could not load", res.error.message);
      }
      return;
    }
    if (!res.data || res.data.error) {
      try { localStorage.removeItem("dir-token"); } catch (e) {}
      document.getElementById("socName").textContent = "Society Directory";
      panel("🔒", "That link doesn't work",
        "It may have expired, been revoked, or been mistyped. Try another.", true);
      return;
    }
    data = res.data;
    try { localStorage.setItem("dir-token", t); } catch (e) {}
    render();
  });
})();
</script>
</body>
</html>
