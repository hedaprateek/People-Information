<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6d5ef8">
<title>Society Directory</title>
<style>
/* ============================== tokens ============================== */
:root{
  --bg:#f7f8fc;
  --bg-tint:#eef0fb;
  --surface:#ffffff;
  --surface-2:#f3f4f9;
  --text:#12141c;
  --text-2:#4a4f60;
  --muted:#767c90;
  --border:#e5e7f0;
  --border-2:#d3d7e6;

  --brand:#6d5ef8;
  --brand-2:#9d7bff;
  --brand-ink:#4a3dd6;
  --brand-soft:#efecff;

  --danger:#e0364c;
  --danger-soft:#ffeef0;
  --danger-ink:#b31f33;

  --ok:#0f9d76;

  --r-sm:10px; --r:14px; --r-lg:20px;
  --sh-1:0 1px 2px rgba(19,22,40,.05);
  --sh-2:0 2px 6px rgba(19,22,40,.06), 0 10px 28px -12px rgba(19,22,40,.14);
  --sh-3:0 6px 14px rgba(19,22,40,.09), 0 22px 48px -16px rgba(19,22,40,.22);
  --ring:0 0 0 3px rgba(109,94,248,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d14;
    --bg-tint:#12152080;
    --surface:#14172130;
    --surface-2:#1b1f2d;
    --text:#eef0f7;
    --text-2:#b6bccd;
    --muted:#868da3;
    --border:#242938;
    --border-2:#333a4d;

    --brand:#8f83ff;
    --brand-2:#b79cff;
    --brand-ink:#c4bcff;
    --brand-soft:#1e1b3a;

    --danger:#ff6b7d;
    --danger-soft:#2b141a;
    --danger-ink:#ff92a0;

    --ok:#3ddCa4;

    --sh-1:0 1px 2px rgba(0,0,0,.5);
    --sh-2:0 2px 6px rgba(0,0,0,.45), 0 10px 28px -12px rgba(0,0,0,.7);
    --sh-3:0 6px 14px rgba(0,0,0,.5), 0 22px 48px -16px rgba(0,0,0,.85);
    --ring:0 0 0 3px rgba(143,131,255,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d14; --bg-tint:#12152080; --surface:#141721; --surface-2:#1b1f2d;
  --text:#eef0f7; --text-2:#b6bccd; --muted:#868da3;
  --border:#242938; --border-2:#333a4d;
  --brand:#8f83ff; --brand-2:#b79cff; --brand-ink:#c4bcff; --brand-soft:#1e1b3a;
  --danger:#ff6b7d; --danger-soft:#2b141a; --danger-ink:#ff92a0; --ok:#3ddca4;
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 2px 6px rgba(0,0,0,.45), 0 10px 28px -12px rgba(0,0,0,.7);
  --sh-3:0 6px 14px rgba(0,0,0,.5), 0 22px 48px -16px rgba(0,0,0,.85);
  --ring:0 0 0 3px rgba(143,131,255,.35);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ============================== hero ============================== */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border);
  background:var(--surface)}
.hero::before{
  content:"";position:absolute;inset:-60% -20% auto -20%;height:340px;
  background:
    radial-gradient(42% 60% at 18% 30%, rgba(109,94,248,.30), transparent 70%),
    radial-gradient(38% 55% at 78% 20%, rgba(157,123,255,.26), transparent 70%),
    radial-gradient(30% 45% at 50% 80%, rgba(80,190,255,.18), transparent 70%);
  filter:blur(12px);pointer-events:none;
}
.hero-in{position:relative;display:flex;align-items:center;gap:18px;
  padding:30px 20px 26px;max-width:1080px;margin:0 auto}
.crest{
  width:60px;height:60px;flex:none;border-radius:18px;display:grid;place-items:center;
  font-size:25px;font-weight:800;letter-spacing:-.03em;color:#fff;
  background:linear-gradient(145deg,var(--brand),var(--brand-2));
  box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,.35);
}
.crest img{width:100%;height:100%;object-fit:cover;border-radius:18px}
.hero h1{margin:0;font-size:clamp(21px,3.4vw,30px);font-weight:750;letter-spacing:-.035em;line-height:1.15}
.hero .sub{color:var(--muted);font-size:14px;margin-top:3px}
.spacer{flex:1}
.icon-btn{
  width:40px;height:40px;flex:none;display:grid;place-items:center;cursor:pointer;
  border-radius:12px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);font-size:17px;line-height:1;transition:.18s;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-2);box-shadow:var(--sh-1);transform:translateY(-1px)}
.icon-btn:focus-visible{outline:none;box-shadow:var(--ring)}

.scope-tag{
  display:inline-flex;align-items:center;gap:6px;margin-top:9px;
  padding:3px 10px 3px 8px;border-radius:999px;font-size:11.5px;font-weight:650;
  letter-spacing:.02em;background:var(--brand-soft);color:var(--brand-ink);
}
.scope-tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ============================== sections ============================== */
main{padding:30px 0 80px}
section{margin-bottom:38px;animation:rise .45s cubic-bezier(.22,1,.36,1) both}
section:nth-child(2){animation-delay:.05s}
section:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 15px}
.sec-head h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.pill{
  font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--border);
}
.rule{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}

/* ============================== cards ============================== */
.card{
  position:relative;display:flex;gap:13px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:15px;box-shadow:var(--sh-1);
  transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s,border-color .2s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-3);border-color:var(--border-2)}

.av{
  width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;
  font-weight:700;font-size:15.5px;letter-spacing:-.02em;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
}
.body{min-width:0;flex:1}
.nm{font-weight:650;letter-spacing:-.015em;font-size:15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{
  display:inline-block;margin-bottom:5px;font-size:10.5px;font-weight:750;
  letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink);
  background:var(--brand-soft);padding:2.5px 8px;border-radius:6px;
}
.meta{color:var(--muted);font-size:13px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.contact-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--brand-ink);background:var(--brand-soft);
  padding:5px 11px;border-radius:9px;transition:.16s;
}
.chip:hover{background:var(--brand);color:#fff;transform:translateY(-1px)}
.chip:focus-visible{outline:none;box-shadow:var(--ring)}
.chip.mail{color:var(--text-2);background:var(--surface-2)}
.chip.mail:hover{background:var(--text-2);color:var(--surface)}
.chip svg{width:13px;height:13px;flex:none}

/* emergency */
.card.sos{background:var(--danger-soft);border-color:transparent;
  box-shadow:inset 0 0 0 1px rgba(224,54,76,.25),var(--sh-1)}
.card.sos .av{background:linear-gradient(145deg,var(--danger),#ff7a5c)!important}
.card.sos .role{color:var(--danger-ink);background:rgba(224,54,76,.13)}
.card.sos .chip{color:#fff;background:var(--danger)}
.card.sos .chip:hover{filter:brightness(1.1)}

/* ============================== search ============================== */
.toolbar{
  position:sticky;top:0;z-index:20;margin:0 -20px 16px;padding:12px 20px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.toolbar.stuck{border-bottom-color:var(--border)}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:14px;width:16px;height:16px;color:var(--muted);pointer-events:none}
input[type=search],input[type=text]{
  width:100%;font:inherit;font-size:14.5px;color:var(--text);
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:11px 14px 11px 40px;transition:.18s;box-shadow:var(--sh-1);
}
input::placeholder{color:var(--muted)}
input:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
input[type=search]::-webkit-search-cancel-button{cursor:pointer}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.fchip{
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  padding:6px 13px;border-radius:999px;transition:.16s;
  background:var(--surface);color:var(--text-2);border:1px solid var(--border);
}
.fchip:hover{border-color:var(--border-2);color:var(--text)}
.fchip[aria-pressed="true"]{
  background:linear-gradient(145deg,var(--brand),var(--brand-2));
  color:#fff;border-color:transparent;box-shadow:var(--sh-2);
}
.fchip:focus-visible{outline:none;box-shadow:var(--ring)}

.result-note{color:var(--muted);font-size:13px;margin:2px 0 12px}

/* ============================== states ============================== */
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:38px 28px;text-align:center;box-shadow:var(--sh-2);
  max-width:520px;margin:40px auto;
}
.panel .big{font-size:34px;margin-bottom:10px}
.panel h3{margin:0 0 7px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.panel p{margin:0;color:var(--muted);font-size:14px}
.panel .search{margin-top:20px}
.panel input{padding-left:14px;text-align:center}
.btn{
  margin-top:11px;width:100%;font:inherit;font-size:14.5px;font-weight:650;cursor:pointer;
  color:#fff;border:none;border-radius:12px;padding:11px 18px;
  background:linear-gradient(145deg,var(--brand),var(--brand-2));
  box-shadow:var(--sh-2);transition:.18s;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}

.empty{color:var(--muted);font-size:14px;padding:26px;text-align:center;
  border:1px dashed var(--border-2);border-radius:var(--r)}

/* skeleton */
.sk{border-radius:var(--r);height:76px;border:1px solid var(--border);
  background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);
  background-size:220% 100%;animation:shim 1.3s ease-in-out infinite}
@keyframes shim{from{background-position:150% 0}to{background-position:-50% 0}}

footer{color:var(--muted);font-size:12.5px;text-align:center;padding:0 20px 40px}

@media (max-width:520px){
  .wrap{padding:0 15px}
  .hero-in{padding:22px 15px 20px;gap:13px}
  .crest{width:50px;height:50px;border-radius:15px;font-size:21px}
  .toolbar{margin:0 -15px 14px;padding:11px 15px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-in">
    <div class="crest" id="crest">·</div>
    <div style="min-width:0">
      <h1 id="socName">Loading…</h1>
      <div class="sub" id="socSub"></div>
      <div id="scopeTag"></div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</div>

<main class="wrap" id="app">
  <div class="grid" style="margin-top:8px">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
</main>
<footer id="foot"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  // Safe to publish: every table has RLS on with no policies, so this key can
  // reach nothing but get_directory(), which enforces scope server-side.
  var SUPABASE_URL = "https://axrphdcjvwzpcqmorbgw.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4cnBoZGNqdnd6cGNxbW9yYmd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NjkxNTYsImV4cCI6MjEwMjQ0NTE1Nn0.o_PUwx1Y5bbkUPP7SxuDqhpT-04X3jxJmov3RdjKB3k";

  var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var app = document.getElementById("app");
  var data = null;

  /* ---------------- theme ---------------- */
  try {
    var pref = localStorage.getItem("dir-theme");
    if (pref) document.documentElement.setAttribute("data-theme", pref);
  } catch (e) {}
  document.getElementById("themeBtn").onclick = function () {
    var cur = document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("dir-theme", next); } catch (e) {}
  };

  /* ---------------- dom helpers ---------------- */
  // Everything is built as nodes with textContent — never innerHTML with
  // member data, so a name containing markup can't inject anything.
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null && text !== "") n.textContent = text;
    return n;
  }
  var ICON = {
    phone: "M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z",
    mail: "M3 5h18v14H3V5zm2 2v.5l7 4.5 7-4.5V7H5zm0 2.9V17h14V9.9l-7 4.5-7-4.5z",
    search: "M10 3a7 7 0 105.3 11.6l4 4 1.4-1.4-4-4A7 7 0 0010 3zm0 2a5 5 0 110 10 5 5 0 010-10z"
  };
  function svg(path) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "currentColor");
    s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", path);
    s.appendChild(p);
    return s;
  }

  // Deterministic avatar colour, so the same person keeps the same tile.
  function hue(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }
  function initials(name) {
    var parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }
  function avatar(name) {
    var a = el("div", "av", initials(name));
    var h = hue(String(name || ""));
    a.style.background = "linear-gradient(145deg,hsl(" + h + " 68% 58%),hsl(" + ((h + 38) % 360) + " 72% 64%))";
    return a;
  }

  /* ---------------- cards ---------------- */
  function card(p, sos) {
    var c = el("div", "card" + (sos ? " sos" : ""));
    var display = p.name || p.label || "—";
    c.appendChild(avatar(display));

    var b = el("div", "body");
    var top = p.role || (p.name ? p.label : null);
    if (top) b.appendChild(el("span", "role", top));
    b.appendChild(el("div", "nm", display));

    var sub = [p.flat_no, p.notes].filter(Boolean).join(" · ");
    if (sub) b.appendChild(el("div", "meta", sub));

    var row = el("div", "contact-row");
    [p.phone, p.alt_phone].filter(Boolean).forEach(function (num) {
      var a = el("a", "chip");
      a.href = "tel:" + String(num).replace(/[^\d+]/g, "");
      a.appendChild(svg(ICON.phone));
      a.appendChild(el("span", null, num));
      row.appendChild(a);
    });
    if (p.email) {
      var m = el("a", "chip mail");
      m.href = "mailto:" + p.email;
      m.appendChild(svg(ICON.mail));
      m.appendChild(el("span", null, "Email"));
      row.appendChild(m);
    }
    if (row.childNodes.length) b.appendChild(row);

    c.appendChild(b);
    return c;
  }

  function section(title, count) {
    var s = el("section");
    var h = el("div", "sec-head");
    h.appendChild(el("h2", null, title));
    if (count != null) h.appendChild(el("span", "pill", String(count)));
    h.appendChild(el("div", "rule"));
    s.appendChild(h);
    return s;
  }
  function gridOf(items, sos) {
    var g = el("div", "grid");
    items.forEach(function (i) { g.appendChild(card(i, sos)); });
    return g;
  }

  /* ---------------- header ---------------- */
  function renderHead(s, scope) {
    document.getElementById("socName").textContent = s.name || "Society Directory";
    document.title = s.name || "Society Directory";

    var bits = [s.address, s.city, s.pincode].filter(Boolean).join(", ");
    if (s.tagline) bits = bits ? s.tagline + " · " + bits : s.tagline;
    document.getElementById("socSub").textContent = bits;

    var crest = document.getElementById("crest");
    crest.textContent = "";
    if (s.logo_url) {
      var img = document.createElement("img");
      img.src = s.logo_url; img.alt = "";
      img.onerror = function () { crest.textContent = (s.name || "S").trim().charAt(0).toUpperCase(); };
      crest.appendChild(img);
    } else {
      crest.textContent = (s.name || "S").trim().charAt(0).toUpperCase();
    }

    var tag = document.getElementById("scopeTag");
    tag.textContent = "";
    var t = el("span", "scope-tag");
    t.appendChild(el("span", "dot"));
    t.appendChild(el("span", null, scope === "residents" ? "Residents view" : "Public view"));
    tag.appendChild(t);

    document.getElementById("foot").textContent =
      s.registration_no ? "Reg. " + s.registration_no : "";
  }

  /* ---------------- residents ---------------- */
  function renderMembers() {
    if (data.scope !== "residents") return null;
    var s = section("Residents", data.members.length);
    if (!data.members.length) {
      s.appendChild(el("div", "empty", "No residents recorded yet."));
      return s;
    }

    var blocks = [];
    data.members.forEach(function (m) {
      if (m.block && blocks.indexOf(m.block) === -1) blocks.push(m.block);
    });
    blocks.sort();

    var bar = el("div", "toolbar");
    var sw = el("div", "search");
    sw.appendChild(svg(ICON.search));
    var q = document.createElement("input");
    q.type = "search";
    q.placeholder = "Search by name, flat or phone…";
    sw.appendChild(q);
    bar.appendChild(sw);

    var active = "";
    if (blocks.length > 1) {
      var chips = el("div", "chips");
      [""].concat(blocks).forEach(function (b) {
        var btn = el("button", "fchip", b ? "Block " + b : "All");
        btn.setAttribute("aria-pressed", b === active ? "true" : "false");
        btn.onclick = function () {
          active = b;
          Array.prototype.forEach.call(chips.children, function (x) {
            x.setAttribute("aria-pressed", "false");
          });
          btn.setAttribute("aria-pressed", "true");
          draw();
        };
        chips.appendChild(btn);
      });
      bar.appendChild(chips);
    }
    s.appendChild(bar);

    var note = el("div", "result-note");
    var grid = el("div", "grid");
    s.appendChild(note);
    s.appendChild(grid);

    function draw() {
      var term = q.value.trim().toLowerCase();
      var hits = data.members.filter(function (m) {
        if (active && m.block !== active) return false;
        if (!term) return true;
        return [m.name, m.flat_no, m.block, m.phone, m.email, m.role]
          .filter(Boolean).join(" ").toLowerCase().indexOf(term) !== -1;
      });

      grid.textContent = "";
      hits.forEach(function (m) {
        var flat = [m.block, m.flat_no].filter(Boolean).join("-");
        grid.appendChild(card({
          name: m.name, role: m.role, flat_no: flat,
          phone: m.phone, email: m.email
        }, false));
      });

      if (!hits.length) {
        grid.appendChild(el("div", "empty", "Nobody matches that search."));
        note.textContent = "";
      } else {
        note.textContent = hits.length === data.members.length
          ? data.members.length + " residents"
          : "Showing " + hits.length + " of " + data.members.length;
      }
    }

    q.addEventListener("input", draw);
    draw();

    // subtle divider once the sticky bar lifts off
    requestAnimationFrame(function () {
      var io = new IntersectionObserver(function (en) {
        bar.classList.toggle("stuck", en[0].intersectionRatio < 1);
      }, { threshold: [1] });
      io.observe(bar);
    });
    return s;
  }

  /* ---------------- render ---------------- */
  function render() {
    renderHead(data.society, data.scope);
    app.textContent = "";

    if (data.committee.length) {
      var s1 = section("Committee", data.committee.length);
      s1.appendChild(gridOf(data.committee, false));
      app.appendChild(s1);
    }

    var sos = data.contacts.filter(function (c) { return c.is_emergency; });
    if (sos.length) {
      var s2 = section("Emergency", sos.length);
      s2.appendChild(gridOf(sos, true));
      app.appendChild(s2);
    }

    var rest = data.contacts.filter(function (c) { return !c.is_emergency; });
    var groups = {}, order = [];
    rest.forEach(function (c) {
      var k = c.category || "General";
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(c);
    });
    order.forEach(function (k) {
      var s3 = section(k, groups[k].length);
      s3.appendChild(gridOf(groups[k], false));
      app.appendChild(s3);
    });

    var mem = renderMembers();
    if (mem) app.appendChild(mem);

    if (!app.childNodes.length) {
      panel("📋", "Nothing published yet",
        "This directory has no entries. Add them in the admin tool, then reload.");
    }
  }

  /* ---------------- states ---------------- */
  function panel(emoji, title, body, withInput, message) {
    app.textContent = "";
    var p = el("div", "panel");
    p.appendChild(el("div", "big", emoji));
    p.appendChild(el("h3", null, title));
    p.appendChild(el("p", null, body));
    if (withInput) {
      var sw = el("div", "search");
      var inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "Paste your link or token";
      try { inp.value = localStorage.getItem("dir-token") || ""; } catch (e) {}
      sw.appendChild(inp);
      p.appendChild(sw);
      var go = el("button", "btn", "Open directory");
      go.onclick = function () {
        var v = extract(inp.value);
        if (!v) { inp.focus(); return; }
        try { localStorage.setItem("dir-token", v); } catch (e) {}
        location.hash = v;
        location.reload();
      };
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go.click(); });
      p.appendChild(go);
    }
    app.appendChild(p);
    if (withInput) p.querySelector("input").focus();
  }

  function extract(raw) {
    raw = (raw || "").trim();
    var m = raw.match(/[?&#]t=([^&\s]+)/);
    if (m) return decodeURIComponent(m[1]);
    m = raw.match(/#([A-Za-z0-9_-]{8,})\s*$/);
    return m ? m[1] : raw;
  }
  function token() {
    var p = new URLSearchParams(location.search).get("t");
    if (p) return p.trim();
    if (location.hash.length > 1) return location.hash.slice(1).trim();
    return "";
  }

  /* ---------------- load ---------------- */
  var t = extract(token());
  if (!t) {
    document.getElementById("socName").textContent = "Society Directory";
    panel("🔑", "Open your directory",
      "Paste the share link you were given. It is remembered on this device.", true);
    return;
  }

  db.rpc("get_directory", { p_token: t }).then(function (res) {
    if (res.error) {
      document.getElementById("socName").textContent = "Society Directory";
      if (/find the function|does not exist|schema cache/i.test(res.error.message || "")) {
        panel("🛠", "Database not set up yet",
          "Run supabase/migration.sql in the Supabase SQL Editor, then reload.");
      } else {
        panel("⚠️", "Could not load", res.error.message);
      }
      return;
    }
    if (!res.data || res.data.error) {
      try { localStorage.removeItem("dir-token"); } catch (e) {}
      document.getElementById("socName").textContent = "Society Directory";
      panel("🔒", "That link doesn't work",
        "It may have expired, been revoked, or been mistyped. Try another.", true);
      return;
    }
    data = res.data;
    try { localStorage.setItem("dir-token", t); } catch (e) {}
    render();
  });
})();
</script>
</body>
</html>
