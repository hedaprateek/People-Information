<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1b2d">
<title>Society Directory</title>
<style>
/* ============================ tokens ============================ */
:root{
  --bg:#f5f7fa;
  --surface:#ffffff;
  --surface-2:#eff2f7;
  --text:#0f1b2d;
  --text-2:#3f4c60;
  --muted:#6b7688;
  --border:#dfe4ec;
  --border-2:#c6cedb;

  --navy:#0f1b2d;
  --navy-2:#1c2c45;
  --accent:#1d4ed8;
  --accent-ink:#1e40af;
  --accent-soft:#eaf0fe;

  --alert:#b42318;
  --alert-soft:#fdf0ee;

  --navh:48px;
  --r:10px; --r-sm:8px; --r-lg:14px;
  --sh:0 1px 2px rgba(15,27,45,.05);
  --sh-2:0 2px 4px rgba(15,27,45,.06), 0 8px 20px -10px rgba(15,27,45,.16);
  --tap:44px;
}
:root[data-theme="dark"]{
  --bg:#0c111a; --surface:#141b27; --surface-2:#1c2534;
  --text:#e9edf4; --text-2:#b3bccb; --muted:#8592a6;
  --border:#232d3d; --border-2:#33405473;
  --navy:#0a0f18; --navy-2:#141b27;
  --accent:#5b8def; --accent-ink:#8ab0f7; --accent-soft:#16233a;
  --alert:#f97066; --alert-soft:#2a1512;
  --sh:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 2px 4px rgba(0,0,0,.5), 0 8px 20px -10px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
@media(min-width:700px){ .wrap{padding:0 28px} }

/* ============================ masthead ============================ */
.hero{
  background:linear-gradient(180deg,var(--navy),var(--navy-2));
  color:#fff;padding-top:env(safe-area-inset-top);
  border-bottom:3px solid var(--accent);
}
.hero-in{
  max-width:1000px;margin:0 auto;padding:22px 16px 24px;
  display:flex;align-items:center;gap:14px;
}
@media(min-width:700px){ .hero-in{padding:30px 28px 32px;gap:18px} }
.crest{
  width:52px;height:52px;flex:none;border-radius:var(--r);display:grid;place-items:center;
  font-size:21px;font-weight:700;letter-spacing:-.03em;color:#fff;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
}
@media(min-width:700px){ .crest{width:62px;height:62px;font-size:25px} }
.crest img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.hero h1{
  margin:0;font-weight:650;letter-spacing:-.025em;line-height:1.18;
  font-size:clamp(19px,4.6vw,28px);
}
.hero .sub{color:rgba(255,255,255,.70);font-size:13px;margin-top:3px;font-weight:400}
@media(min-width:700px){ .hero .sub{font-size:14px} }
.badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:9px;
  padding:3px 10px;border-radius:5px;font-size:11px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
  background:rgba(255,255,255,.10);color:rgba(255,255,255,.86);
  border:1px solid rgba(255,255,255,.20);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:#4ade80}
.spacer{flex:1}
.icon-btn{
  width:var(--tap);height:var(--tap);flex:none;display:grid;place-items:center;cursor:pointer;
  border-radius:var(--r-sm);font-size:17px;line-height:1;color:rgba(255,255,255,.85);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.20);
  transition:.16s;-webkit-tap-highlight-color:transparent;
}
.icon-btn:hover{background:rgba(255,255,255,.16);color:#fff}
.icon-btn:active{transform:scale(.94)}

/* ============================ stats ============================ */
.stats{
  display:grid;gap:1px;max-width:1000px;margin:0 auto;
  background:var(--border);border-bottom:1px solid var(--border);
}
.stat{background:var(--surface);padding:14px 12px;text-align:center}
@media(min-width:700px){ .stat{padding:18px 16px} }
.stat .n{font-size:24px;font-weight:650;letter-spacing:-.03em;line-height:1.1;
  font-variant-numeric:tabular-nums}
@media(min-width:700px){ .stat .n{font-size:29px} }
.stat .l{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-top:3px}

/* ============================ section nav ============================ */
.nav{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--border);box-shadow:var(--sh)}
.nav-in{max-width:1000px;margin:0 auto;display:flex;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 8px}
.nav-in::-webkit-scrollbar{display:none}
@media(min-width:700px){ .nav-in{padding:0 20px} }
.nav a{
  flex:none;text-decoration:none;color:var(--muted);white-space:nowrap;
  font-size:13.5px;font-weight:600;padding:14px 12px 11px;
  border-bottom:2px solid transparent;transition:.16s;
  -webkit-tap-highlight-color:transparent;
}
.nav a:hover{color:var(--text)}
.nav a.on{color:var(--accent-ink);border-bottom-color:var(--accent)}

/* floating back-to-top */
.fab{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
  width:46px;height:46px;border-radius:50%;cursor:pointer;z-index:50;
  display:grid;place-items:center;color:var(--text-2);
  background:var(--surface);border:1px solid var(--border-2);box-shadow:var(--sh-2);
  opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s;
}
.fab.show{opacity:1;pointer-events:auto;transform:none}
.fab:active{transform:scale(.93)}
.fab svg{width:20px;height:20px}

/* ============================ sections ============================ */
main{padding:28px 0 calc(56px + env(safe-area-inset-bottom))}
section{margin-bottom:34px;animation:rise .4s ease-out both;
  scroll-margin-top:calc(var(--navh) + 14px)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sec-head{display:flex;align-items:center;gap:10px;margin:0 0 13px;
  padding-bottom:9px;border-bottom:1px solid var(--border)}
.sec-ico{
  width:28px;height:28px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--accent-ink);background:var(--accent-soft);
}
.sec-ico svg{width:15px;height:15px}
.sec-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-2);flex:1}
.pill{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:600px){ .grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))} }

/* ============================ cards ============================ */
.card{
  position:relative;display:flex;gap:13px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 15px;box-shadow:var(--sh);transition:border-color .16s,box-shadow .16s;
}
@media(hover:hover){ .card:hover{border-color:var(--border-2);box-shadow:var(--sh-2)} }

.av{
  width:42px;height:42px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;
  font-weight:650;font-size:14.5px;letter-spacing:-.02em;
  color:var(--accent-ink);background:var(--accent-soft);
  border:1px solid rgba(29,78,216,.14);
}
:root[data-theme="dark"] .av{border-color:rgba(91,141,239,.2)}
.body{min-width:0;flex:1}
.role{
  display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);margin-bottom:2px;
}
.nm{font-weight:600;letter-spacing:-.015em;font-size:15.5px;line-height:1.3}
.meta{color:var(--muted);font-size:13px;margin-top:2px}

.contact-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:38px;padding:0 13px;border-radius:var(--r-sm);text-decoration:none;
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--accent-ink);background:var(--accent-soft);
  border:1px solid rgba(29,78,216,.16);transition:.16s;
  -webkit-tap-highlight-color:transparent;
}
.chip:hover{background:var(--accent);color:#fff;border-color:transparent}
.chip:active{transform:scale(.97)}
.chip.mail{color:var(--text-2);background:var(--surface-2);border-color:var(--border)}
.chip.mail:hover{background:var(--text-2);color:var(--surface)}
.chip svg{width:14px;height:14px;flex:none}
@media(max-width:599px){ .chip{flex:1 1 auto} }

/* emergency — red is reserved for exactly this */
.card.sos{border-left:3px solid var(--alert);background:var(--alert-soft)}
.card.sos .av{color:var(--alert);background:rgba(180,35,24,.09);
  border-color:rgba(180,35,24,.18)}
.card.sos .role{color:var(--alert)}
.card.sos .chip{color:#fff;background:var(--alert);border-color:transparent}
.card.sos .chip:hover{filter:brightness(1.1)}
.card.sos .chip.mail{background:rgba(180,35,24,.09);color:var(--alert)}
.sec-head.sos .sec-ico{color:var(--alert);background:rgba(180,35,24,.09)}

/* ============================ search ============================ */
.toolbar{
  position:sticky;top:var(--navh);z-index:30;margin:0 -16px 14px;padding:11px 16px;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
@media(min-width:700px){ .toolbar{margin:0 -28px 16px;padding:12px 28px} }
.toolbar.stuck{border-bottom-color:var(--border)}
.search{position:relative;display:flex;align-items:center}
.search>svg{position:absolute;left:13px;width:16px;height:16px;color:var(--muted);
  pointer-events:none}
input[type=search],input[type=text]{
  width:100%;font:inherit;font-size:16px;color:var(--text);min-height:var(--tap);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 14px 10px 39px;transition:.16s;
}
input::placeholder{color:var(--muted)}
input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(29,78,216,.14)}

.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.fchip{
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  min-height:36px;padding:0 14px;border-radius:var(--r-sm);transition:.16s;flex:none;
  background:var(--surface);color:var(--text-2);border:1px solid var(--border);
  -webkit-tap-highlight-color:transparent;
}
.fchip:hover{border-color:var(--border-2)}
.fchip:active{transform:scale(.96)}
.fchip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .fchip[aria-pressed="true"]{background:var(--accent);
  border-color:var(--accent)}
.result-note{color:var(--muted);font-size:13px;margin:3px 0 11px}

/* ============================ states ============================ */
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:34px 24px;text-align:center;box-shadow:var(--sh-2);
  max-width:430px;margin:36px auto;
}
.panel .ico{width:44px;height:44px;margin:0 auto 14px;border-radius:var(--r);
  display:grid;place-items:center;color:var(--accent-ink);background:var(--accent-soft)}
.panel .ico svg{width:22px;height:22px}
.panel h3{margin:0 0 7px;font-size:17px;font-weight:650;letter-spacing:-.02em}
.panel p{margin:0;color:var(--muted);font-size:14px}
.panel .search{margin-top:20px}
.panel input{padding-left:14px;text-align:center}
.btn{
  margin-top:10px;width:100%;font:inherit;font-size:15px;font-weight:600;cursor:pointer;
  color:#fff;border:1px solid var(--navy);border-radius:var(--r-sm);
  min-height:var(--tap);padding:11px 18px;background:var(--navy);transition:.16s;
}
.btn:hover{background:var(--navy-2)}
.btn:active{transform:scale(.98)}
:root[data-theme="dark"] .btn{background:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:28px 20px;text-align:center;
  border:1px dashed var(--border-2);border-radius:var(--r)}
.sk{border-radius:var(--r);height:74px;border:1px solid var(--border);
  background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);
  background-size:220% 100%;animation:shim 1.3s ease-in-out infinite}
@keyframes shim{from{background-position:150% 0}to{background-position:-50% 0}}
footer{color:var(--muted);font-size:12px;text-align:center;
  padding:0 16px calc(30px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-in">
    <div class="crest" id="crest">·</div>
    <div style="min-width:0;flex:1">
      <h1 id="socName">Loading…</h1>
      <div class="sub" id="socSub"></div>
      <div id="scopeTag"></div>
    </div>
    <div style="display:flex;gap:8px;flex:none">
      <button class="icon-btn" id="shareBtn" title="Share this link" aria-label="Share this link"></button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</div>
<div class="stats" id="stats"></div>
<nav class="nav" id="nav" hidden><div class="nav-in" id="navIn"></div></nav>

<main class="wrap" id="app">
  <div class="grid" style="margin-top:20px">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
</main>
<footer id="foot"></footer>
<button class="fab" id="topBtn" title="Back to top" aria-label="Back to top"></button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  // Safe to publish: every table has RLS on with no policies, so this key
  // reaches nothing but get_directory(), which enforces scope server-side.
  var SUPABASE_URL = "https://axrphdcjvwzpcqmorbgw.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4cnBoZGNqdnd6cGNxbW9yYmd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NjkxNTYsImV4cCI6MjEwMjQ0NTE1Nn0.o_PUwx1Y5bbkUPP7SxuDqhpT-04X3jxJmov3RdjKB3k";

  var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var app = document.getElementById("app");
  var data = null;

  /* ---------------- theme ---------------- */
  try {
    if (localStorage.getItem("dir-theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) {}
  document.getElementById("themeBtn").onclick = function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    if (dark) document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", "dark");
    try { localStorage.setItem("dir-theme", dark ? "light" : "dark"); } catch (e) {}
    document.querySelector('meta[name=theme-color]')
      .setAttribute("content", dark ? "#0f1b2d" : "#0a0f18");
  };

  /* ---------------- icons ---------------- */
  var ICON = {
    phone:"M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z",
    mail:"M3 5h18v14H3V5zm2 2v.5l7 4.5 7-4.5V7H5zm0 2.9V17h14V9.9l-7 4.5-7-4.5z",
    search:"M10 3a7 7 0 105.3 11.6l4 4 1.4-1.4-4-4A7 7 0 0010 3zm0 2a5 5 0 110 10 5 5 0 010-10z",
    users:"M16 11a4 4 0 10-4-4 4 4 0 004 4zm-8 1a3 3 0 10-3-3 3 3 0 003 3zm8 1c-2.7 0-8 1.3-8 4v3h16v-3c0-2.7-5.3-4-8-4zM8 14c-2.3 0-6 1.1-6 3.5V20h4v-3c0-1.3.6-2.4 1.6-3.2A9 9 0 008 14z",
    alert:"M12 2L1 21h22L12 2zm0 5l7.5 12.9h-15L12 7zm-1 4v4h2v-4h-2zm0 5v2h2v-2h-2z",
    wrench:"M21.7 5.6l-3.4 3.4-2.3-2.3 3.4-3.4a5.5 5.5 0 00-7 6.8L3.6 18a2 2 0 002.8 2.8l7.9-8.8a5.5 5.5 0 007.4-6.4z",
    bolt:"M13 2L3 14h7l-1 8 10-12h-7l1-8z",
    building:"M3 21V7l7-4 7 4v14h4v2H0v-2h3zm4-2h2v-3H7v3zm4 0h2v-3h-2v3zm-4-5h2v-3H7v3zm4 0h2v-3h-2v3zm4 5h2v-3h-2v3zm0-5h2v-3h-2v3z",
    home:"M12 3L2 12h3v9h6v-6h2v6h6v-9h3L12 3z",
    folder:"M3 5h6l2 2h10v12H3V5zm2 2v10h14V9h-8.8l-2-2H5z",
    key:"M14 2a7 7 0 00-6.8 8.7L2 16v6h6v-3h3v-3h2l1.4-1.4A7 7 0 1014 2zm3 5a2 2 0 11-2-2 2 2 0 012 2z",
    lock:"M17 9V7a5 5 0 00-10 0v2H5v12h14V9h-2zm-8-2a3 3 0 016 0v2H9V7z",
    tools:"M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h12v2H3v-2z",
    doc:"M6 2h8l4 4v16H6V2zm7 1.5V7h3.5L13 3.5zM8 12h8v2H8v-2zm0 4h8v2H8v-2z",
    up:"M12 5l7 7-1.4 1.4L13 8.8V20h-2V8.8l-4.6 4.6L5 12l7-7z",
    share:"M18 16a3 3 0 00-2 .8l-7-4a3 3 0 000-1.6l7-4A3 3 0 1015 5l-7 4a3 3 0 100 6l7 4a3 3 0 103-3z",
    check:"M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"
  };
  function svg(path, cls) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "currentColor");
    s.setAttribute("aria-hidden", "true");
    if (cls) s.setAttribute("class", cls);
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", path);
    s.appendChild(p);
    return s;
  }
  // Category -> icon. Colour stays constant; only the glyph varies.
  function iconFor(name) {
    var k = String(name || "").toLowerCase();
    if (k.indexOf("emerg") > -1) return ICON.alert;
    if (k.indexOf("mainten") > -1 || k.indexOf("repair") > -1) return ICON.wrench;
    if (k.indexOf("utilit") > -1) return ICON.bolt;
    if (k.indexOf("office") > -1 || k.indexOf("admin") > -1) return ICON.building;
    if (k.indexOf("committee") > -1) return ICON.users;
    if (k.indexOf("resident") > -1) return ICON.home;
    if (k.indexOf("vendor") > -1 || k.indexOf("service") > -1) return ICON.tools;
    return ICON.folder;
  }

  /* ---------------- dom helpers ---------------- */
  // Built as nodes with textContent — never innerHTML with member data.
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null && text !== "") n.textContent = text;
    return n;
  }
  function initials(name) {
    var parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }

  /* ---------------- card ---------------- */
  function card(p, sos) {
    var c = el("div", "card" + (sos ? " sos" : ""));
    var display = p.name || p.label || "—";
    c.appendChild(el("div", "av", initials(display)));

    var b = el("div", "body");
    var top = p.role || (p.name ? p.label : null);
    if (top) b.appendChild(el("span", "role", top));
    b.appendChild(el("div", "nm", display));

    var sub = [p.flat_no, p.notes].filter(Boolean).join(" · ");
    if (sub) b.appendChild(el("div", "meta", sub));

    var row = el("div", "contact-row");
    [p.phone, p.alt_phone].filter(Boolean).forEach(function (num) {
      var a = el("a", "chip");
      a.href = "tel:" + String(num).replace(/[^\d+]/g, "");
      a.appendChild(svg(ICON.phone));
      a.appendChild(el("span", null, num));
      row.appendChild(a);
    });
    if (p.email) {
      var m = el("a", "chip mail");
      m.href = "mailto:" + p.email;
      m.appendChild(svg(ICON.mail));
      m.appendChild(el("span", null, "Email"));
      row.appendChild(m);
    }
    if (row.childNodes.length) b.appendChild(row);
    c.appendChild(b);
    return c;
  }

  function section(title, count, icon, sos) {
    var s = el("section");
    var h = el("div", "sec-head" + (sos ? " sos" : ""));
    var box = el("div", "sec-ico");
    box.appendChild(svg(icon));
    h.appendChild(box);
    h.appendChild(el("h2", null, title));
    if (count != null) h.appendChild(el("span", "pill", String(count)));
    s.appendChild(h);
    return s;
  }
  function gridOf(items, sos) {
    var g = el("div", "grid");
    items.forEach(function (i) { g.appendChild(card(i, sos)); });
    return g;
  }

  /* ---------------- header + stats ---------------- */
  function renderHead(s, scope) {
    document.getElementById("socName").textContent = s.name || "Society Directory";
    document.title = s.name || "Society Directory";

    var bits = [s.address, s.city, s.pincode].filter(Boolean).join(", ");
    if (s.tagline) bits = bits ? s.tagline + " · " + bits : s.tagline;
    document.getElementById("socSub").textContent = bits;

    var crest = document.getElementById("crest");
    crest.textContent = "";
    if (s.logo_url) {
      var img = document.createElement("img");
      img.src = s.logo_url; img.alt = "";
      img.onerror = function () {
        crest.textContent = (s.name || "S").trim().charAt(0).toUpperCase();
      };
      crest.appendChild(img);
    } else {
      crest.textContent = (s.name || "S").trim().charAt(0).toUpperCase();
    }

    var tag = document.getElementById("scopeTag");
    tag.textContent = "";
    var t = el("span", "badge");
    t.appendChild(el("span", "dot"));
    t.appendChild(el("span", null, scope === "residents" ? "Residents view" : "Public view"));
    tag.appendChild(t);

    document.getElementById("foot").textContent =
      s.registration_no ? "Reg. " + s.registration_no : "";
  }

  function renderStats() {
    var box = document.getElementById("stats");
    box.textContent = "";
    var cells = [];
    if (data.scope === "residents") cells.push([data.members.length, "Residents"]);
    cells.push([data.committee.length, "Committee"]);
    cells.push([data.contacts.length, "Contacts"]);

    box.style.gridTemplateColumns = "repeat(" + cells.length + ",1fr)";
    cells.forEach(function (c) {
      var d = el("div", "stat");
      d.appendChild(el("div", "n", String(c[0])));
      d.appendChild(el("div", "l", c[1]));
      box.appendChild(d);
    });
  }

  /* ---------------- residents ---------------- */
  function renderMembers() {
    if (data.scope !== "residents") return null;
    var s = section("Residents", data.members.length, ICON.home);
    if (!data.members.length) {
      s.appendChild(el("div", "empty", "No residents recorded yet."));
      return s;
    }

    var blocks = [];
    data.members.forEach(function (m) {
      if (m.block && blocks.indexOf(m.block) === -1) blocks.push(m.block);
    });
    blocks.sort();

    var bar = el("div", "toolbar");
    var sw = el("div", "search");
    sw.appendChild(svg(ICON.search));
    var q = document.createElement("input");
    q.type = "search";
    q.placeholder = "Search name, flat or phone…";
    sw.appendChild(q);
    bar.appendChild(sw);

    var active = "";
    if (blocks.length > 1) {
      var chips = el("div", "chips");
      [""].concat(blocks).forEach(function (b) {
        var btn = el("button", "fchip", b ? "Block " + b : "All");
        btn.setAttribute("aria-pressed", b === active ? "true" : "false");
        btn.onclick = function () {
          active = b;
          Array.prototype.forEach.call(chips.children, function (x) {
            x.setAttribute("aria-pressed", "false");
          });
          btn.setAttribute("aria-pressed", "true");
          draw();
        };
        chips.appendChild(btn);
      });
      bar.appendChild(chips);
    }
    s.appendChild(bar);

    var note = el("div", "result-note");
    var grid = el("div", "grid");
    s.appendChild(note);
    s.appendChild(grid);

    function draw() {
      var term = q.value.trim().toLowerCase();
      var hits = data.members.filter(function (m) {
        if (active && m.block !== active) return false;
        if (!term) return true;
        return [m.name, m.flat_no, m.block, m.phone, m.email, m.role]
          .filter(Boolean).join(" ").toLowerCase().indexOf(term) !== -1;
      });

      grid.textContent = "";
      hits.forEach(function (m) {
        grid.appendChild(card({
          name: m.name, role: m.role,
          flat_no: [m.block, m.flat_no].filter(Boolean).join("-"),
          phone: m.phone, email: m.email
        }, false));
      });

      if (!hits.length) {
        grid.appendChild(el("div", "empty", "Nobody matches that search."));
        note.textContent = "";
      } else {
        note.textContent = hits.length === data.members.length
          ? data.members.length + " residents"
          : "Showing " + hits.length + " of " + data.members.length;
      }
    }
    q.addEventListener("input", draw);
    draw();

    requestAnimationFrame(function () {
      var io = new IntersectionObserver(function (en) {
        bar.classList.toggle("stuck", en[0].intersectionRatio < 1);
      }, { threshold: [1] });
      io.observe(bar);
    });
    return s;
  }

  /* ---------------- render ---------------- */
  function render() {
    renderHead(data.society, data.scope);
    renderStats();
    app.textContent = "";

    var nav = [];
    function add(title, node) {
      node.id = slug(title);
      app.appendChild(node);
      nav.push({ id: node.id, title: title, node: node });
    }

    if (data.committee.length) {
      var s1 = section("Committee", data.committee.length, ICON.users);
      s1.appendChild(gridOf(data.committee, false));
      add("Committee", s1);
    }

    var sos = data.contacts.filter(function (c) { return c.is_emergency; });
    if (sos.length) {
      var s2 = section("Emergency", sos.length, ICON.alert, true);
      s2.appendChild(gridOf(sos, true));
      add("Emergency", s2);
    }

    var rest = data.contacts.filter(function (c) { return !c.is_emergency; });
    var groups = {}, order = [];
    rest.forEach(function (c) {
      var k = c.category || "General";
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(c);
    });
    order.forEach(function (k) {
      var s3 = section(k, groups[k].length, iconFor(k));
      s3.appendChild(gridOf(groups[k], false));
      add(k, s3);
    });

    var mem = renderMembers();
    if (mem) add("Residents", mem);

    if (!nav.length) {
      panel(ICON.doc, "Nothing published yet",
        "This directory has no entries. Add them in the admin tool, then reload.");
      return;
    }
    buildNav(nav);

    // honour a #section deep-link on first load
    var want = location.hash.slice(1);
    if (want) {
      var hit = nav.filter(function (e) { return e.id === want; })[0];
      if (hit) setTimeout(function () {
        hit.node.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 60);
    }

    // let readers leave this directory and open a different link
    var f = document.getElementById("foot");
    f.appendChild(document.createElement("br"));
    var sw = document.createElement("a");
    sw.href = location.pathname;
    sw.textContent = "Open a different directory";
    sw.style.cssText = "color:inherit;font-size:11.5px";
    sw.onclick = function () { try { localStorage.removeItem("dir-token"); } catch (e) {} };
    f.appendChild(sw);
  }

  /* ---------------- states ---------------- */
  function panel(icon, title, body, withInput) {
    document.getElementById("stats").textContent = "";
    app.textContent = "";
    var p = el("div", "panel");
    var box = el("div", "ico");
    box.appendChild(svg(icon));
    p.appendChild(box);
    p.appendChild(el("h3", null, title));
    p.appendChild(el("p", null, body));
    if (withInput) {
      var sw = el("div", "search");
      var inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "Paste your link or token";
      try { inp.value = localStorage.getItem("dir-token") || ""; } catch (e) {}
      sw.appendChild(inp);
      p.appendChild(sw);
      var go = el("button", "btn", "Open directory");
      go.onclick = function () {
        var v = extract(inp.value);
        if (!v) { inp.focus(); return; }
        try { localStorage.setItem("dir-token", v); } catch (e) {}
        gotoToken(v);
      };
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go.click(); });
      p.appendChild(go);
    }
    app.appendChild(p);
    if (withInput) p.querySelector("input").focus();
  }

  function extract(raw) {
    raw = (raw || "").trim();
    var m = raw.match(/[?&#]t=([^&\s]+)/);
    if (m) return decodeURIComponent(m[1]);
    m = raw.match(/#([A-Za-z0-9]{16,})\s*$/); // a bare token pasted with a #
    return m ? m[1] : raw;
  }

  // The token lives in ?t= so the hash stays free for section navigation.
  // A hash token is still accepted (older links) and upgraded to ?t=.
  function token() {
    var p = new URLSearchParams(location.search).get("t");
    if (p) return p.trim();
    var h = location.hash.slice(1).trim();
    if (/^[A-Za-z0-9]{16,}$/.test(h)) return h;
    return "";
  }
  function gotoToken(v) {
    location.replace(location.pathname + "?t=" + encodeURIComponent(v));
  }

  /* ---------------- share ---------------- */
  var shareBtn = document.getElementById("shareBtn");
  shareBtn.appendChild(svg(ICON.share));
  shareBtn.onclick = function () {
    var url = location.origin === "null" || location.protocol === "file:"
      ? null : location.href;
    if (!url) {
      alert("This page is open as a local file, so there is no public address " +
            "to share yet. Publish it first (GitHub Pages), then share from there.");
      return;
    }
    var title = document.getElementById("socName").textContent;
    if (navigator.share) {
      navigator.share({ title: title, url: url }).catch(function () {});
      return;
    }
    navigator.clipboard.writeText(url).then(function () {
      shareBtn.textContent = "";
      shareBtn.appendChild(svg(ICON.check));
      setTimeout(function () {
        shareBtn.textContent = "";
        shareBtn.appendChild(svg(ICON.share));
      }, 1600);
    }).catch(function () { prompt("Copy this link:", url); });
  };

  /* ---------------- back to top ---------------- */
  var topBtn = document.getElementById("topBtn");
  topBtn.appendChild(svg(ICON.up));
  topBtn.onclick = function () {
    // Drop the section hash so the browser Back button doesn't walk back
    // through every section the reader scrolled past.
    history.replaceState(null, "", location.pathname + location.search);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  addEventListener("scroll", function () {
    topBtn.classList.toggle("show", scrollY > 420);
  }, { passive: true });

  /* ---------------- section nav ---------------- */
  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function buildNav(entries) {
    var nav = document.getElementById("nav");
    var box = document.getElementById("navIn");
    box.textContent = "";
    if (entries.length < 2) { nav.hidden = true; return; }
    nav.hidden = false;

    entries.forEach(function (e) {
      var a = document.createElement("a");
      a.href = "#" + e.id;
      a.textContent = e.title;
      a.dataset.id = e.id;
      a.onclick = function (ev) {
        ev.preventDefault();
        // pushState keeps the browser Back button meaningful between sections
        history.pushState(null, "", "#" + e.id);
        e.node.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      box.appendChild(a);
    });

    function mark(id) {
      Array.prototype.forEach.call(box.children, function (a) {
        var on = a.dataset.id === id;
        a.classList.toggle("on", on);
        if (on && box.scrollWidth > box.clientWidth) {
          var l = a.offsetLeft - (box.clientWidth - a.offsetWidth) / 2;
          box.scrollTo({ left: Math.max(0, l), behavior: "smooth" });
        }
      });
    }

    // scroll-spy: the topmost section intersecting below the nav wins
    var seen = {};
    var spy = new IntersectionObserver(function (rows) {
      rows.forEach(function (r) { seen[r.target.id] = r.isIntersecting; });
      for (var i = 0; i < entries.length; i++) {
        if (seen[entries[i].id]) { mark(entries[i].id); return; }
      }
    }, { rootMargin: "-" + (parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue("--navh")) + 20) + "px 0px -55% 0px" });
    entries.forEach(function (e) { spy.observe(e.node); });

    addEventListener("hashchange", function () {
      var id = location.hash.slice(1);
      var hit = entries.filter(function (e) { return e.id === id; })[0];
      if (hit) hit.node.scrollIntoView({ behavior: "smooth", block: "start" });
      else if (!location.hash) window.scrollTo({ top: 0, behavior: "smooth" });
    });

    mark(entries[0].id);
  }

  /* ---------------- load ---------------- */
  var t = token();
  if (!t) {
    // Fall back to the last directory opened on this device, so a bare visit
    // to the site still lands somewhere useful instead of on a prompt.
    var remembered = "";
    try { remembered = localStorage.getItem("dir-token") || ""; } catch (e) {}
    if (remembered) { gotoToken(remembered); return; }

    document.getElementById("socName").textContent = "Society Directory";
    panel(ICON.key, "Open your directory",
      "Paste the share link you were given. It is remembered on this device.", true);
    return;
  }
  // Upgrade an old #token link to ?t= so the hash is free for navigation
  if (!new URLSearchParams(location.search).get("t")) { gotoToken(t); return; }

  db.rpc("get_directory", { p_token: t }).then(function (res) {
    if (res.error) {
      document.getElementById("socName").textContent = "Society Directory";
      if (/find the function|does not exist|schema cache/i.test(res.error.message || "")) {
        panel(ICON.doc, "Database not set up yet",
          "Run supabase/migration.sql in the Supabase SQL Editor, then reload.");
      } else {
        panel(ICON.alert, "Could not load", res.error.message);
      }
      return;
    }
    if (!res.data || res.data.error) {
      try { localStorage.removeItem("dir-token"); } catch (e) {}
      document.getElementById("socName").textContent = "Society Directory";
      panel(ICON.lock, "That link doesn't work",
        "It may have expired, been revoked, or been mistyped. Try another.", true);
      return;
    }
    data = res.data;
    try { localStorage.setItem("dir-token", t); } catch (e) {}
    render();
  });
})();
</script>
</body>
</html>
