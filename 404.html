<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Page not found — Society Directory</title>
<meta name="theme-color" content="#0A1628">
<!-- GitHub's own 404 says "Page not found · GitHub Pages" and offers no way
     back, which is a dead end for a resident who mistyped or followed an old
     link. This says the same thing in plain words and gives them one button.

     Deliberately no jargon: the number 404 means nothing to most people, so it
     is not the headline. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100dvh;display:grid;place-items:center;padding:24px;
    background:linear-gradient(150deg,#0A1628,#0F1E36 55%,#152242);
    color:#E8EEF6;line-height:1.55;
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{width:100%;max-width:400px;background:rgba(15,30,54,.75);
    border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:30px 26px;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.8)}
  .dot{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    font-weight:700;font-size:22px;color:#0A1628;margin-bottom:18px;
    background:linear-gradient(135deg,#0EA5C8,#E0A81E)}
  h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
  p{font-size:14.5px;color:#8CA0B8;margin-bottom:20px}
  .hi{display:block;margin-top:5px}
  a.go{display:block;text-align:center;text-decoration:none;font-size:15.5px;
    font-weight:600;color:#0A1628;background:#0EA5C8;border-radius:11px;
    padding:14px 16px;min-height:48px;transition:.16s}
  a.go:hover{background:#22C3E6}
  .foot{margin-top:20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:#5C6E88;text-align:center}
</style>
</head>
<body>
  <div class="card">
    <div class="dot">S</div>
    <h1>That page isn't here</h1>
    <p>The link may be old, or there may be a small typo in the address. Nothing
      is broken — the directory is working.
      <span class="hi">यह पेज नहीं मिला। लिंक पुराना हो सकता है या पते में कोई छोटी ग़लती है।
      निर्देशिका ठीक चल रही है।</span></p>
    <a class="go" href="./">Go to the directory · निर्देशिका खोलें</a>
    <div class="foot">Stunity Tech — by Prateek</div>
  </div>
</body>
</html>
