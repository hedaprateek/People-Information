<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Society Directory</title>
<meta name="description" content="Committee, emergency numbers, service contacts, resident directory and society documents — all in one place.">
<meta property="og:type" content="website">
<meta property="og:title" content="Society Directory">
<meta property="og:description" content="Committee, emergency numbers, service contacts, residents and documents — one page, always current.">
<meta name="theme-color" content="#0A1628">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230EA5C8'/%3E%3Cstop offset='1' stop-color='%23E0A81E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7l8 6v12H8V13z' fill='%230A1628'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* The palette is the only thing that varies between themes; everything below
     is written against these names. Set "Theme" in the About sheet. */
  :root{
    --navy:#0A1628; --navy-2:#0F1E36; --navy-3:#152242;
    --teal:#0EA5C8; --teal-bright:#22C3E6; --gold:#E0A81E; --alert:#F2555A;
    --line:rgba(255,255,255,.10); --muted:#8CA0B8;
    --fg:#E8EEF6; --fg-2:#C4D2E4; --on-accent:var(--navy);
    /* Text sitting on a tinted alert or caution panel. Picked for a dark
       page; the light theme overrides all six. */
    --alert-fg:#FFC2C5; --alert-tint:rgba(242,85,90,.09); --alert-line:rgba(242,85,90,.30);
    --alert-num:#FF9198;
    --warn-fg:#F2DFAE; --warn-tint:rgba(224,168,30,.10); --warn-line:rgba(224,168,30,.34);
    --tap:44px; --navh:60px;
  }

  html[data-theme="forest"]{
    --navy:#07160F; --navy-2:#0C2418; --navy-3:#123322;
    --teal:#10B981; --teal-bright:#34D399; --gold:#A3E635; --alert:#F87171;
    --muted:#8AA79A; --fg:#E7F3EC; --fg-2:#BFDCCC;
  }
  html[data-theme="plum"]{
    --navy:#150B1C; --navy-2:#221030; --navy-3:#2E1742;
    --teal:#A855F7; --teal-bright:#C084FC; --gold:#F472B6; --alert:#FB7185;
    --muted:#A691B5; --fg:#F2EAF7; --fg-2:#D8C7E4;
  }
  html[data-theme="slate"]{
    --navy:#0D1117; --navy-2:#161B22; --navy-3:#1F2731;
    --teal:#38BDF8; --teal-bright:#7DD3FC; --gold:#FBBF24; --alert:#F87171;
    --muted:#8B98A8; --fg:#E9EEF4; --fg-2:#C3CDD9;
  }
  html[data-theme="sunset"]{
    --navy:#1A0E12; --navy-2:#2A151B; --navy-3:#3A1D25;
    --teal:#FB923C; --teal-bright:#FDBA74; --gold:#FCD34D; --alert:#F43F5E;
    --muted:#B49A93; --fg:#FBEEE8; --fg-2:#E8CDBF;
  }
  html[data-theme="ocean"]{
    --navy:#041520; --navy-2:#07242F; --navy-3:#0B3242;
    --teal:#22D3EE; --teal-bright:#67E8F9; --gold:#5EEAD4; --alert:#FB7185;
    --muted:#84A7B5; --fg:#E4F4F9; --fg-2:#B9DFEA;
  }

  /* A light theme needs more than a palette swap: the hero sits on a pale
     background, so its white text and shadows have to be undone. */
  html[data-theme="paper"]{
    --navy:#F5F7FB; --navy-2:#FFFFFF; --navy-3:#EDF1F8;
    --teal:#1D4ED8; --teal-bright:#1E40AF; --gold:#B45309; --alert:#B91C1C;
    --line:rgba(15,23,42,.13); --muted:#5B6676;
    --fg:#0F172A; --fg-2:#334155; --on-accent:#FFFFFF;
    --alert-fg:#991B1B; --alert-tint:rgba(185,28,28,.07); --alert-line:rgba(185,28,28,.28);
    --alert-num:#B91C1C;
    --warn-fg:#8A4B0B; --warn-tint:rgba(180,83,9,.08); --warn-line:rgba(180,83,9,.30);
  }
  html[data-theme="paper"] .hero h1{text-shadow:none}
  html[data-theme="paper"] .hero .sub{color:var(--muted);text-shadow:none}
  html[data-theme="paper"] .brand .dot{color:#fff}
  html[data-theme="paper"] .icon-btn{color:var(--fg-2)}
  html[data-theme="paper"] .stat .num{color:var(--fg)}
  html[data-theme="paper"] .av{color:#fff}
  html[data-theme="paper"] .hero-glow,
  html[data-theme="paper"] .hero-glow-2{opacity:.45}
  /* nav and .searchbar take their colour from --navy, which every theme sets,
     so they need no per-theme override. */
  html[data-theme="paper"] .nav-links{background:rgba(255,255,255,.98)}
  *{box-sizing:border-box;margin:0;padding:0}
  /* .ccard and .prow set their own display, which outranks the browser's
     [hidden] rule — without this, filtering hides nothing. */
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  /* Noto Sans Devanagari carries the Hindi text; Latin still renders in Inter
     because Devanagari has no Latin glyphs to fall back on. */
  body{font-family:'Inter','Noto Sans Devanagari',system-ui,sans-serif;
    background:var(--navy);color:var(--fg);
    line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3,h4{font-family:'Space Grotesk','Noto Sans Devanagari',sans-serif;letter-spacing:-.02em}
  /* Devanagari sits taller than Latin, so give it a little more room */
  html[lang="hi"] body{line-height:1.7}
  html[lang="hi"] .nm,html[lang="hi"] .pname{line-height:1.45}
  html[lang="hi"] .role,html[lang="hi"] .sec-head h2,html[lang="hi"] .stat .l{letter-spacing:.02em}
  .lang{font-family:'Noto Sans Devanagari','Inter',sans-serif;font-size:12.5px;font-weight:600}
  a{color:inherit;text-decoration:none}
  /* viewport-fit=cover puts the page under the rounded corners and the home
     indicator, so the gutters have to clear whatever the device reserves. */
  .wrap{max-width:1220px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right))}
  @media(min-width:700px){ .wrap{padding:0 24px} }

  .rail{position:fixed;left:0;top:0;height:100vh;width:3px;background:var(--line);z-index:60}
  .rail-fill{width:100%;height:0;background:linear-gradient(var(--teal),var(--gold));transition:height .1s linear}

  /* ── Nav ── */
  /* Opaque by default. A frosted bar needs backdrop-filter to blur what passes
     behind it; plenty of Android browsers do not have it, and there the bar is
     simply see-through and the cards scroll straight through the search field.
     So the solid colour is the base and the glass is the enhancement. */
  nav{position:sticky;top:0;z-index:50;background:var(--navy);
    border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:var(--navh);gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:600;
    font-size:15px;min-width:0}
  .brand .dot{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal),var(--gold));color:var(--on-accent);font-size:13px;font-weight:700}
  .brand .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-links{display:flex;gap:22px;font-size:13.5px;color:var(--muted)}
  .nav-links a{transition:color .2s;white-space:nowrap}
  .nav-links a:hover,.nav-links a.on{color:var(--teal-bright)}
  .nav-right{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .nav-cta{font-size:13px;font-weight:600;color:#fff;background:var(--alert);
    padding:9px 14px;border-radius:8px;transition:.18s;white-space:nowrap}
  .nav-cta:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;width:37px;height:37px;
    display:grid;place-items:center;cursor:pointer;color:var(--fg);flex-shrink:0;transition:.2s}
  .icon-btn:hover{border-color:var(--teal);color:var(--teal-bright)}
  .icon-btn svg{width:18px;height:18px}
  .nav-toggle{display:none}
  .nav-toggle .x{display:none}
  .nav-toggle[aria-expanded="true"] .x{display:block}
  .nav-toggle[aria-expanded="true"] .bars{display:none}
  @media(max-width:980px){
    .nav-toggle{display:grid}
    .nav-links{position:absolute;top:var(--navh);left:0;right:0;flex-direction:column;gap:0;display:none;
      background:var(--navy);border-bottom:1px solid var(--line);
      padding:6px 20px 14px;max-height:70vh;overflow-y:auto}
    .nav-links.open{display:flex}
    .nav-links a{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
    .nav-links a:last-child{border-bottom:none}
  }
  @media(max-width:430px){ .brand .bn{display:none} .nav-cta{padding:9px 11px} }

  /* ── Hero (tightened) ── */
  .hero{position:relative;padding:40px 0 34px;overflow:hidden}
  @media(min-width:700px){ .hero{padding:58px 0 46px} }
  .hero-glow{position:absolute;top:-40%;right:-8%;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle,rgba(14,165,200,.17),transparent 62%);pointer-events:none}
  .hero-glow-2{position:absolute;bottom:-50%;left:-14%;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle,rgba(224,168,30,.10),transparent 62%);pointer-events:none}
  .hero .wrap{position:relative;z-index:1}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--teal-bright);margin-bottom:16px;
    border:1px solid var(--line);padding:6px 13px;border-radius:100px;background:rgba(14,165,200,.06)}
  .eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,165,200,.5)}70%{box-shadow:0 0 0 8px rgba(14,165,200,0)}100%{box-shadow:0 0 0 0 rgba(14,165,200,0)}}
  .hero h1{font-size:clamp(27px,5.2vw,46px);font-weight:700;line-height:1.06;margin-bottom:12px}
  .hero h1 .accent{background:linear-gradient(100deg,var(--teal-bright),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.lede{font-size:15px;color:var(--muted);max-width:640px;margin-bottom:22px}
  .hero-stats{display:flex;gap:26px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
  @media(min-width:700px){ .hero-stats{gap:38px} }
  /* Each count is a link to its section, so it has to look tappable. */
  .stat{display:block;text-decoration:none;color:inherit;cursor:pointer;
    border:0;background:none;padding:0;text-align:left;font:inherit;
    border-bottom:2px solid transparent;transition:border-color .15s,transform .15s}
  .stat:hover,.stat:focus-visible{border-bottom-color:var(--teal-bright);transform:translateY(-1px)}
  .stat:hover .lbl,.stat:focus-visible .lbl{color:var(--fg)}
  .stat:focus-visible{outline:none}
  .stat .num{font-family:'Space Grotesk';font-size:25px;font-weight:700;color:#fff;line-height:1}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;transition:color .15s}

  /* ── Search ── */
  /* +1px clears the nav's own bottom border, which the bar otherwise covers. */
  .searchbar{position:sticky;top:calc(var(--navh) + 1px);z-index:45;background:var(--navy);
    border-bottom:1px solid var(--line);padding:10px 0}

  /* The glass, only where the blur behind it actually works. */
  @supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)) {
    nav{background:color-mix(in srgb,var(--navy) 88%,transparent);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .searchbar{background:color-mix(in srgb,var(--navy) 94%,transparent);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  }
  .sfield{position:relative;display:flex;align-items:center}
  .sfield>svg{position:absolute;left:14px;width:16px;height:16px;color:var(--muted);pointer-events:none}
  .sfield input{width:100%;font:inherit;font-size:16px;color:var(--fg);min-height:var(--tap);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px 10px 41px;transition:.2s}
  .sfield input::placeholder{color:var(--muted)}
  .sfield input:focus{outline:none;border-color:var(--teal);background:rgba(14,165,200,.07)}
  /* The type=search clear cross is inconsistent across browsers and absent on
     Android, so the field brings its own — full tap height, right-hand thumb. */
  .sfield input::-webkit-search-cancel-button{display:none}
  .qclear{position:absolute;right:0;width:var(--tap);height:var(--tap);flex-shrink:0;
    display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;
    color:var(--muted);border-radius:10px;-webkit-tap-highlight-color:transparent}
  .qclear svg{width:17px;height:17px}
  .qclear:hover{color:var(--fg)}
  .sfield input{padding-right:calc(var(--tap) + 2px)}

  /* ── Two-column layout ── */
  .layout{display:flex;flex-direction:column;gap:16px;padding:26px 0 44px}
  .side{display:contents}          /* phones: panels become siblings, orderable */
  /* Home shows tiles only, so a panel appears solely on its own page — which
     means it belongs below the back bar, not above it. */
  .main{order:0;min-width:0}
  .p-sos{order:1}
  .p-docs{order:2}
  @media(min-width:1000px){
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start;
      padding:30px 0 56px}
    .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(var(--navh) + 66px)}
    /* No panels on screen: do not hold the sidebar column open. */
    .layout.solo{grid-template-columns:minmax(0,1fr)}
    .main,.side>*{order:0}
  }

  /* ── Section head (compact) ── */
  /* The nav and the search bar are both sticky, so anything scrolled to the
     top of the viewport lands underneath them. Every jump target reserves that
     much room above itself. */
  .sec,.panel{scroll-margin-top:calc(var(--navh) + 74px)}
  .sec{margin-bottom:26px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .sec-head h2{font-size:15px;font-weight:600;letter-spacing:.02em}
  .sec-head .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sec-chev{display:none}
  @media(max-width:700px){
    /* The header used to fill the screen before a single contact appeared.
       Name and tagline are enough up top; the address is in the footer. */
    .hero{padding:22px 0 16px}
    .hero p.lede{display:none}
    .eyebrow{margin-bottom:9px;font-size:10.5px;padding:5px 11px}
    .hero h1{font-size:clamp(21px,6vw,28px);margin-bottom:8px}
    .hero-stats{gap:20px;padding-top:13px}
    .stat .num{font-size:20px}
    .stat .lbl{font-size:10.5px;margin-top:2px}

    /* The top pad keeps the first record clear of the search bar rather
       than tucked against it. (The card sizing lives with the card CSS
       below — up here the later base rules would beat it.) */
    .layout{padding:20px 0 32px;gap:12px}
    .sec{margin-bottom:20px}
  }

  @media(max-width:700px){
    /* Folded sections turn a long directory into a short menu on a phone. */
    .sec-head{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
      padding-top:4px;padding-bottom:10px}
    .sec-head:active{opacity:.7}
    .sec-chev{display:block;width:15px;height:15px;flex:none;color:var(--muted);
      transition:transform .2s}
    .sec.closed .sec-chev{transform:rotate(-90deg)}
    .sec.closed .cgrid,.sec.closed .secnote{display:none}
    .sec.closed{margin-bottom:10px;border-bottom:1px solid var(--line)}
  }
  .sec-head .tag{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--teal)}

  /* ── Compact contact card ── */
  /* Cards size to their content — nothing is clipped or ellipsised. */
  /* stretch, not start: cards in a row match height and their action rows
     line up, instead of each card ending wherever its text happens to stop */
  .cgrid{display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch}
  @media(min-width:620px){ .cgrid{grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:12px} }
  .ccard{display:flex;flex-direction:column;padding:13px 14px;border-radius:12px;min-width:0;
    background:var(--navy-2);border:1px solid var(--line);
    transition:border-color .18s,transform .18s,background .18s}
  .ccard:hover{border-color:rgba(14,165,200,.45);transform:translateY(-2px);background:var(--navy-3)}

  .chead{display:flex;align-items:flex-start;gap:11px}
  .av{width:38px;height:38px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;
    overflow:hidden;font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--navy);
    background:linear-gradient(135deg,var(--teal),var(--teal-bright))}
  .av img{width:100%;height:100%;object-fit:cover}
  .cid{flex:1;min-width:0}
  .nm{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
  .role{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-top:2px;line-height:1.4}
  .rate{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--gold);white-space:nowrap;
    background:rgba(224,168,30,.13);border:1px solid rgba(224,168,30,.30);
    padding:3px 8px;border-radius:7px;margin-top:1px}

  .cdet{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px;overflow-wrap:anywhere}
  /* A wing and number can repeat across a flat and a row house, so the kind of
     home is the only thing telling two identical addresses apart. */
     Built from --fg-2 and --line so it stays legible in every theme without
     competing with the gold charge and red blood badges. */
  .utype{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.03em;
    color:var(--fg-2);background:var(--line);border:1px solid var(--line);
    border-radius:5px;padding:1px 7px;margin-right:7px;vertical-align:1px;white-space:nowrap}
  .cdet b{color:var(--fg-2);font-weight:600}

  /* Collapsed by default so every card in a row keeps the same height. */
  .blood{flex-shrink:0;font-size:11.5px;font-weight:700;white-space:nowrap;
    color:var(--alert-fg);background:var(--alert-tint);border:1px solid var(--alert-line);
    padding:3px 8px;border-radius:7px;margin-top:1px;margin-left:6px}

  /* Same disclosure treatment as the owner block, so a card never grows
     just because someone answered more questions. */
  .more{margin-top:9px}

  .owner{margin-top:10px}
  .owner>summary,.more>summary{list-style:none;cursor:pointer;display:inline-flex;
    align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.05em;
    color:var(--teal-bright);background:var(--navy-3);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;min-height:32px;transition:.16s;
    -webkit-tap-highlight-color:transparent}
  .owner>summary::-webkit-details-marker,.more>summary::-webkit-details-marker{display:none}
  .owner>summary::marker,.more>summary::marker{content:""}
  .owner>summary:hover,.more>summary:hover{color:var(--fg);border-color:var(--teal)}
  /* Open state must stay readable — the label used to vanish against its own
     background once the panel expanded. */
  .owner[open]>summary,.more[open]>summary{color:var(--fg);background:var(--navy-3)}
  .owner>summary .chev,.more>summary .chev{width:13px;height:13px;transition:transform .18s}
  .owner[open]>summary .chev,.more[open]>summary .chev{transform:rotate(180deg)}
  .owner .obody,.more .mbody{margin-top:8px;padding:9px 11px;border-radius:9px;
    background:var(--navy-3);border:1px solid var(--line)}
  .owner .onm{font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
  .owner .oline{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px;
    overflow-wrap:anywhere}
  .owner .oline a{color:var(--teal-bright);font-weight:600;font-variant-numeric:tabular-nums}
  .owner .oline a:hover{text-decoration:underline}

  /* margin-top:auto absorbs the spare height, so footers line up across a row */
  .cfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:auto;padding-top:11px;border-top:1px solid var(--line)}
  .tel{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;color:var(--teal-bright);
    font-variant-numeric:tabular-nums;line-height:1.4;overflow-wrap:anywhere}
  .tel:hover{text-decoration:underline}
  .go{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
  .iact{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;
    transition:.18s;-webkit-tap-highlight-color:transparent}
  .iact svg{width:15px;height:15px}
  .iact.call{background:var(--teal);color:var(--on-accent)}
  .iact.call:hover{background:var(--teal-bright);transform:scale(1.06)}
  .iact.alt{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
  .iact.alt:hover{color:var(--teal-bright);border-color:var(--teal)}
  /* WhatsApp's own green, in both themes — people look for the colour, and a
     recoloured icon reads as a different app. The green is fixed, so only the
     glyph can move: #06301A sits at 7.33:1 on it, white at 1.98:1. */
  .iact.wa{background:#25D366;color:#06301A;border:1px solid transparent}
  .iact.wa:hover{background:#1FBE5A;transform:scale(1.06)}
  button.iact{font:inherit;cursor:pointer;padding:0}
  .iact.done{color:var(--teal-bright);border-color:var(--teal)}

  /* A touch browser fires :hover on tap and leaves it applied until you tap
     something else, so a scaled-up button stays scaled. Undo the hover-only
     flourishes where there is no pointer, and give the tap its own feedback. */
  @media(hover:none){
    .iact.call:hover,.iact.wa:hover,.stat:hover,.nav-cta:hover,.tile:hover{transform:none}
    .tile:hover{border-color:var(--line);background:var(--navy-2)}
    .tile:active{border-color:var(--teal);background:var(--navy-3)}
    /* A tapped card would otherwise stay lifted and highlighted, reading as
       "selected" when nothing was selected. */
    .ccard:hover{transform:none;border-color:var(--line);background:var(--navy-2)}
    .iact.alt:hover{color:var(--muted);border-color:var(--line)}
    .stat:hover{border-bottom-color:transparent}
    .stat:hover .lbl{color:var(--muted)}
    .tel:hover{text-decoration:none}
    .iact:active{transform:scale(.94);opacity:.85}
    .stat:active{border-bottom-color:var(--teal-bright)}
    .stat:active .lbl{color:var(--fg)}
    .tel:active{text-decoration:underline}
  }

  /* ── Home tiles ──
     The page is a set of places, not one scroll. Home is the index: one tile
     per section, each showing how much is inside it. */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:620px){ .tiles{grid-template-columns:repeat(3,1fr)} }
  @media(min-width:1000px){ .tiles{grid-template-columns:repeat(4,1fr)} }
  .tile{display:flex;flex-direction:column;gap:9px;min-height:104px;padding:14px;
    background:var(--navy-2);border:1px solid var(--line);border-radius:14px;
    text-decoration:none;color:inherit;transition:.18s;-webkit-tap-highlight-color:transparent}
  .tile:hover{border-color:var(--teal);transform:translateY(-2px);background:var(--navy-3)}
  .tile:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .ticon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:var(--line);color:var(--teal-bright);flex-shrink:0}
  .ticon svg{width:19px;height:19px}
  .tname{font-weight:650;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
  .tcount{margin-top:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tile.urgent .ticon{background:var(--alert-tint);color:var(--alert-num)}
  .tile.urgent{border-color:var(--alert-line)}

  /* ── One section at a time ── */
  .vbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-width:0}
  .vback{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);
    font-size:13.5px;font-weight:600;color:var(--muted);
    -webkit-tap-highlight-color:transparent}
  .vback:hover{color:var(--teal-bright)}
  .vback svg{width:16px;height:16px}
  /* Every section, one tap from any other. The bottom bar only fits four;
     this fits them all and scrolls sideways for the rest. */
  .vnav{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .vnav::-webkit-scrollbar{display:none}
  .vchip{flex:none;display:inline-flex;align-items:center;min-height:38px;
    padding:0 13px;border-radius:999px;white-space:nowrap;
    font-size:12.5px;font-weight:600;color:var(--fg-2);
    background:var(--navy-2);border:1px solid var(--line);transition:.15s;
    -webkit-tap-highlight-color:transparent}
  .vchip:hover{border-color:var(--teal);color:var(--fg)}
  .vchip.on{color:var(--on-accent);background:var(--teal);border-color:var(--teal)}
  @media(max-width:700px){ .vchip{min-height:var(--tap)} }

  /* ── Bottom tab bar (phones) ── */
  .tabbar{display:none}
  @media(max-width:700px){
    /* top:auto is load-bearing. This is a <nav>, so the nav{position:sticky;
       top:0} rule above still applies its top — and top:0 together with
       bottom:0 stretches a fixed element over the whole viewport, where it
       silently swallowed every tap on the page. */
    .tabbar{display:flex;position:fixed;top:auto;left:0;right:0;bottom:0;z-index:55;
      background:var(--navy);border-top:1px solid var(--line);border-bottom:0;
      padding-bottom:env(safe-area-inset-bottom)}
    .tabbar a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:3px;padding:7px 3px;min-height:56px;
      font-size:10px;font-weight:600;color:var(--muted);text-align:center;
      -webkit-tap-highlight-color:transparent}
    .tabbar a svg{width:20px;height:20px}
    .tabbar a.on{color:var(--teal-bright)}
    .tabbar a.sos.on,.tabbar a.sos{color:var(--alert-num)}
    .tabbar .tlbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
    /* The bar floats over the page, so the page has to end above it. */
    footer{padding-bottom:calc(30px + 62px + env(safe-area-inset-bottom))}
  }

  /* ── Compact card extras ── */
  .csub{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px;overflow-wrap:anywhere}
  .crole{color:var(--fg-2)}
  /* Why a card is in the results when the match is not on its face. */
  .cmatch{font-size:12px;color:var(--teal-bright);margin-top:7px;overflow-wrap:anywhere}
  /* The chevron is the only thing announcing that the card opens, so it stays
     on the name row where the eye already is. */
  .cgo{width:15px;height:15px;flex-shrink:0;color:var(--muted);align-self:center;margin-left:2px}
  .ccard{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ccard:hover .cgo{color:var(--teal-bright)}
  .ccard:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* ── Detail sheet ── */
  /* Every inset is written out. A fixed box that sets only three of them
     inherits the fourth and stretches — that is how the tab bar once covered
     the whole screen. */
  .sheet-wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;
    display:flex;align-items:center;justify-content:center;padding:18px}
  .sheet-back{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(3,10,20,.7)}
  .sheet{position:relative;z-index:1;width:100%;max-width:460px;max-height:86vh;
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    background:var(--navy-2);border:1px solid var(--line);border-radius:16px;
    padding:18px 18px 16px}
  .sheet-x{position:absolute;top:8px;right:8px;width:var(--tap);height:var(--tap);
    display:grid;place-items:center;background:none;border:0;cursor:pointer;
    color:var(--muted);border-radius:10px;-webkit-tap-highlight-color:transparent}
  .sheet-x:hover{color:var(--fg)}
  .sheet-x svg{width:18px;height:18px}
  .sheet .chead{padding-right:40px}
  .sline{font-size:13.5px;color:var(--fg-2);line-height:1.55;margin-top:7px;overflow-wrap:anywhere}
  .sline b{color:var(--muted);font-weight:600}
  .sline a{color:var(--teal-bright)}
  .sowner{margin-top:12px;padding:11px 12px;border-radius:10px;
    background:var(--warn-tint);border:1px solid var(--warn-line)}
  .sowner h4{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--warn-fg);margin-bottom:6px}
  .sheet-go{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
    margin-left:0;justify-content:flex-start}
  html.noscroll,html.noscroll body{overflow:hidden}
  @media(max-width:700px){
    /* A sheet from the bottom edge is where a thumb already is. */
    .sheet-wrap{align-items:flex-end;padding:0}
    .sheet{max-width:none;max-height:88vh;border-radius:18px 18px 0 0;
      padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  }

  /* ── Notices ── */
  /* One column at every width: a notice is read, not scanned, and text set
     across a 600px card is easier than two columns of paragraphs. */
  .nlist{display:flex;flex-direction:column;gap:10px}
  .ncard{background:var(--navy-2);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:12px;padding:13px 15px}
  .ncard.pinned{border-left-color:var(--gold);background:var(--warn-tint)}
  .nmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .ndate{font-size:11.5px;font-weight:600;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .nnew,.npin,.ntag{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:2px 7px;border-radius:5px;white-space:nowrap}
  .nnew{color:var(--on-accent);background:var(--teal)}
  .npin{color:var(--warn-fg);background:var(--warn-tint);border:1px solid var(--warn-line)}
  .ntag{color:var(--muted);background:var(--line);font-weight:600}
  .ntitle{font-size:15.5px;font-weight:650;line-height:1.35;overflow-wrap:anywhere}
  .nbody{font-size:13.5px;color:var(--fg-2);line-height:1.6;margin-top:6px;overflow-wrap:anywhere;
    white-space:pre-line}
  .nfile{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;
    font-weight:600;color:var(--teal-bright);min-height:var(--tap)}
  .nfile svg{width:15px;height:15px;flex-shrink:0}
  @media(max-width:700px){
    .ncard{padding:11px 13px;border-radius:11px}
    .ntitle{font-size:15px}
    .nbody{font-size:13px}
  }

  .ccard.sos{border-color:rgba(242,85,90,.42);
    background:linear-gradient(150deg,rgba(242,85,90,.13),var(--navy-2))}
  .ccard.sos .av{background:linear-gradient(135deg,var(--alert),var(--gold));color:#fff}
  .ccard.sos .tel{color:var(--alert-num)}
  .ccard.sos .iact.call{background:var(--alert);color:#fff}

  /* Phone sizing for the cards. This block has to come AFTER the rules it
     overrides: same specificity means source order decides, and when it sat
     higher up the base .iact{width:34px} quietly won and every action button
     rendered below the thumb-sized target it was supposed to have. */
  @media(max-width:700px){
    .cgrid{gap:8px}
    .ccard{padding:10px 12px;border-radius:11px}
    .chead{gap:10px}
    .av{width:36px;height:36px;border-radius:9px;font-size:12.5px}
    .nm{font-size:14.5px}
    .role{font-size:10px;letter-spacing:.08em}
    .csub{font-size:12px;margin-top:2px}
    .cdet{font-size:12px;margin-top:4px;line-height:1.45}
    /* The number lives in the detail sheet now, so the four actions share
       one row: 4×44 + 3×8 = 200px, inside the 264px a card has at 320px. */
    .cfoot{margin-top:9px;padding-top:9px;gap:8px}
    .go{margin-left:0;width:100%;justify-content:flex-start;gap:8px}
    .iact{width:44px;height:44px;border-radius:11px}
    .iact svg{width:17px;height:17px}
  }

  /* ── Side panels ── */
  .panel{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
  .panel.alarm{border-color:rgba(242,85,90,.38);
    background:linear-gradient(165deg,rgba(242,85,90,.11),var(--navy-2))}
  .panel h3{font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    color:var(--teal);margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .panel.alarm h3{color:var(--alert)}
  .panel h3 svg{width:14px;height:14px}
  .panel .cap{font-size:11.5px;color:var(--muted);margin-bottom:11px}
  /* A shut panel keeps its heading and count, and drops the list. */
  .panel.docs h3{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .panel.docs h3 .sec-chev{display:block;width:14px;height:14px;flex:none;margin-left:auto;
    color:var(--muted);transition:transform .2s}
  .panel.docs.closed h3 .sec-chev{transform:rotate(-90deg)}
  .panel.docs.closed .pbody{display:none}
  .panel.docs.closed .cap{margin-bottom:0}
  .prow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
  .prow .info{flex:1;min-width:0}
  .prow .iact{margin-top:2px}
  .prow:last-child{border-bottom:none;padding-bottom:0}
  .prow:first-of-type{padding-top:0}
  .pbadge{width:32px;height:32px;flex-shrink:0;border-radius:8px;display:grid;place-items:center;
    font-family:'Space Grotesk';font-size:10px;font-weight:700;letter-spacing:.02em;
    color:var(--gold);background:rgba(224,168,30,.13);border:1px solid rgba(224,168,30,.28)}
  .panel.alarm .pbadge{color:#fff;background:linear-gradient(135deg,var(--alert),var(--gold));
    border:none;font-size:12.5px}
  .pname{font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
  .pmeta{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:1px;overflow-wrap:anywhere}
  .ptel{font-size:12.5px;font-weight:600;color:var(--alert-num);font-variant-numeric:tabular-nums;
    margin-top:2px;overflow-wrap:anywhere}
  .panel .more{display:block;margin-top:11px;font-size:12px;color:var(--teal-bright);text-align:center}

  /* Notices: a site-wide confidentiality banner, and per-section caveats */
  .banner{display:flex;gap:11px;align-items:flex-start;margin:18px 0 0;padding:12px 14px;
    border-radius:12px;font-size:13px;line-height:1.5;color:var(--warn-fg);
    background:var(--warn-tint);border:1px solid var(--warn-line)}
  .banner svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:var(--gold)}
  .banner b{color:var(--fg);font-weight:600}
  .secnote{display:flex;gap:10px;align-items:flex-start;margin:0 0 13px;padding:10px 13px;
    border-radius:10px;font-size:12.5px;line-height:1.5;color:var(--alert-fg);
    background:var(--alert-tint);border:1px solid var(--alert-line)}
  .secnote svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;color:var(--alert)}

  .empty{padding:26px 16px;text-align:center;color:var(--muted);
    border:1px dashed var(--line);border-radius:12px;font-size:14px}

  /* ── Footer ── */
  footer{background:var(--navy);border-top:1px solid var(--line);
    padding:34px 0 calc(30px + env(safe-area-inset-bottom))}
  .foot-grid{display:flex;justify-content:space-between;gap:26px;flex-wrap:wrap;margin-bottom:22px}
  .foot-brand{max-width:320px}
  .foot-brand p{font-size:13.5px;color:var(--muted);margin-top:10px}
  .foot-col h5{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    margin-bottom:10px;font-weight:600}
  .foot-col a{display:block;font-size:14px;color:var(--fg-2);margin-bottom:8px;transition:color .2s}
  .foot-col a:hover{color:var(--teal-bright)}
  .foot-bottom{border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--muted);
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .credit{margin-left:auto}
  .credit b{font-weight:600;color:var(--fg-2)}

  .reveal{opacity:0;transform:translateY(14px);
    transition:opacity .5s cubic-bezier(.2,.7,.3,1),transform .5s cubic-bezier(.2,.7,.3,1)}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;transition:none}.pulse{animation:none}html{scroll-behavior:auto}
  }
  a:focus-visible,button:focus-visible,input:focus-visible{
    outline:2px solid var(--teal-bright);outline-offset:2px;border-radius:6px}
  .fallback{max-width:620px;margin:0 auto;padding:60px 24px;text-align:center;color:var(--muted)}
  .fallback h2{color:#fff;margin-bottom:12px;font-size:22px}
  .fallback a{color:var(--teal-bright);text-decoration:underline}
</style>
</head>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";
  var DATA_FILE = "data.xlsx";
  var mainEl = document.getElementById("main"),
      sosEl  = document.getElementById("pSos"),
      docsEl = document.getElementById("pDocs"),
      qBox   = document.getElementById("q");
  var sections = [], meta = {}, sectionNotes = {}, sectionHindi = {};
  var view = "home";          // which section is on screen; "home" is the index
  // Loose key so "Services & Help" in About matches the sheet tab of that name.
  function key(s){ return String(s).toLowerCase().replace(/[^a-z0-9]/g, ""); }

  /* ---------------- language ---------------- */
  var STR = {
    en: {
      code:"EN", other:"हिं", otherName:"हिंदी में देखें",
      dir:"Resident Directory",
      search:"Search a name, flat, phone or document…",
      emergency:"Emergency",
      membersOnly:"For society members only. ",

      w.setAttribute("aria-label", t("whatsapp") + " " + title);
      w.appendChild(svg(P.wa)); go.appendChild(w);
    }
    if (mail) {
      var m = el("a", "iact alt"); m.href = "mailto:" + mail;
      m.title = t("email") + " " + title;
      m.setAttribute("aria-label", t("email") + " " + title);
      m.appendChild(svg(P.mail)); go.appendChild(m);
    }
    if (shareable(s) && (nums.length || mail)) {
      var sh = el("button", "iact alt");
      sh.setAttribute("type", "button");
      sh.title = t("share") + " " + title;
      sh.setAttribute("aria-label", t("share") + " " + title);
      sh.appendChild(svg(P.share));
      sh.addEventListener("click", function () {
        var txt = shareText(row, map, s, title);
        // The share sheet on a phone offers WhatsApp first; a desktop browser
        // without it gets the message on the clipboard instead.
        if (navigator.share) {
          navigator.share({ title: title, text: txt })["catch"](function () {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(txt).then(function () {
            sh.classList.add("done");
            setTimeout(function () { sh.classList.remove("done"); }, 1400);
          });
        }
      });
      go.appendChild(sh);
    }
    // Dialling a number must not also open the detail sheet behind it.
    go.addEventListener("click", function (ev) { ev.stopPropagation(); });
    return go;
  }

  function avatarFor(row, map, title) {
    var av = el("div", "av");
    if (map.photo && isUrl(row[map.photo])) {
      var img = document.createElement("img");
      img.src = String(row[map.photo]).trim(); img.alt = ""; img.loading = "lazy";
      img.onerror = function () { av.textContent = initials(title); };
      av.appendChild(img);
    } else av.textContent = initials(title);
    return av;
  }
  function placeOf(row, map) {
    return map.place.map(function (k) { return row[k]; }).filter(Boolean).join(" · ");
  }

  /* ---------------- compact contact card ----------------
     Name, where they are, and the ways to reach them. Everything else — the
     vehicle, the blood group, the emergency contact, the owner — is one tap
     away in the detail sheet, so twenty of these fit on a screen instead of
     four. */
  function contact(row, map, sos, term, s) {
    var c = el("div", "ccard" + (sos ? " sos" : ""));
    var title = String(row[map.name] || "").trim() || "—";

    var head = el("div", "chead");
    head.appendChild(avatarFor(row, map, title));

    var cid = el("div", "cid");
    cid.appendChild(el("div", "nm", title));

    var sub = el("div", "csub");
    var utype = map.unit ? String(row[map.unit] || "").trim() : "";
    var place = placeOf(row, map);
    var role = map.role ? String(row[map.role] || "").trim() : "";
    if (utype) sub.appendChild(el("span", "utype", utype));
    if (place) sub.appendChild(document.createTextNode(place));
    if (role) {
      if (place) sub.appendChild(document.createTextNode(" · "));
      sub.appendChild(el("span", "crole", role));
    }
    if (sub.children.length || place) cid.appendChild(sub);
    head.appendChild(cid);

    // Blood group keeps its badge on the face of the card: it is the one field
    // someone scans for in an emergency, and it is useless a tap away.
    var blood = map.blood ? String(row[map.blood] || "").trim() : "";
    var rate = map.rate ? String(row[map.rate] || "").trim() : "";
    if (rate) head.appendChild(el("span", "rate", rate));
    if (blood) head.appendChild(el("span", "blood", blood));
    c.appendChild(head);

    // Filled in by applyFilter when a search matched something not on show.
    var hint = el("div", "cmatch");
    hint.hidden = true;
    c.appendChild(hint);

    var foot = el("div", "cfoot");
    foot.appendChild(actionRow(row, map, s, title));
    c.appendChild(foot);

    /* The card itself opens the detail, so the footer keeps its whole width
       for thumb-sized action buttons. The chevron by the name is what says
       so; the action row stops its own clicks from reaching here. */
    var chev = svg("M9 6l6 6-6 6", true);
    chev.setAttribute("class", "cgo");
    head.appendChild(chev);
    c.setAttribute("role", "button");
    c.setAttribute("tabindex", "0");
    c.setAttribute("aria-label", t("details") + ": " + title);
    var open = function () { openSheet(row, map, s, title); };
    c.addEventListener("click", open);
    c.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); }
    });
    return c;
  }

  /* ---------------- detail sheet ---------------- */
  var sheetOpen = false;

  function closeSheet() {
    var wrap = document.getElementById("sheet");
    if (!wrap) return;
    wrap.hidden = true;
    wrap.textContent = "";
    sheetOpen = false;
    document.documentElement.classList.remove("noscroll");
  }

  function openSheet(row, map, s, title) {
    var wrap = document.getElementById("sheet");
    if (!wrap) return;
    wrap.textContent = "";

    var back = el("div", "sheet-back");
    back.addEventListener("click", closeSheet);
    wrap.appendChild(back);

    var box = el("div", "sheet");
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    box.setAttribute("aria-label", title);

    var x = el("button", "sheet-x");
    x.setAttribute("type", "button");
    x.setAttribute("aria-label", t("close"));
    x.appendChild(svg("M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"));
    x.addEventListener("click", closeSheet);
    box.appendChild(x);

    var head = el("div", "chead");
    head.appendChild(avatarFor(row, map, title));
    var cid = el("div", "cid");
    cid.appendChild(el("div", "nm", title));
    if (map.role && row[map.role]) cid.appendChild(el("div", "role", row[map.role]));
    head.appendChild(cid);
    var blood = map.blood ? String(row[map.blood] || "").trim() : "";
    var rate = map.rate ? String(row[map.rate] || "").trim() : "";
    if (rate) head.appendChild(el("span", "rate", rate));
    if (blood) head.appendChild(el("span", "blood", blood));
    box.appendChild(head);

    var utype = map.unit ? String(row[map.unit] || "").trim() : "";
    var place = placeOf(row, map);
    if (utype || place) {
      var pl = el("div", "cdet");
      if (utype) pl.appendChild(el("span", "utype", utype));
      if (place) pl.appendChild(document.createTextNode(place));
      box.appendChild(pl);
    }

    // The numbers in full, spelled out — this is the page you read, not scan.
    map.phone.forEach(function (k) {
      var v = String(row[k] || "").trim();
      if (!v) return;
      var ln = el("div", "sline");
      ln.appendChild(el("b", null, k + ": "));
      var a = el("a", null, v); a.href = tel(v);
      ln.appendChild(a);
      box.appendChild(ln);
    });
    if (map.email && row[map.email]) {
      var ml = el("div", "sline");
      ml.appendChild(el("b", null, map.email + ": "));
      var am = el("a", null, String(row[map.email]).trim());
      am.href = "mailto:" + String(row[map.email]).trim();
      ml.appendChild(am);
      box.appendChild(ml);
    }

    // Everything else the sheet holds, in full and never truncated.
    map.rest.forEach(function (k) {
      var v = String(row[k] || "").trim();
      if (!v) return;
      var d = el("div", "sline");
      d.appendChild(el("b", null, k + ": "));
      d.appendChild(document.createTextNode(v));
      box.appendChild(d);
    });

    if (map.file) {
      var f = String(row[map.file] || "").trim();
      if (f) {
        var fa = el("a", "nfile");
        fa.href = absUrl(f); fa.target = "_blank"; fa.rel = "noopener";
        fa.appendChild(svg(P.doc));
        fa.appendChild(el("span", null, t("attachment") + " · " + ext(f)));
        box.appendChild(fa);
      }
    }

    /* Tenanted flat: who owns it, and how to reach them. Renders only when the
       row actually carries owner values. */
    var o = map.owner;
    var oName = o.name ? String(row[o.name] || "").trim() : "";
    var oPhones = o.phone.map(function (k) { return String(row[k] || "").trim(); }).filter(Boolean);
    var oAddr = o.address.map(function (k) { return String(row[k] || "").trim(); }).filter(Boolean);
    var oMail = o.email ? String(row[o.email] || "").trim() : "";
    var oOther = o.other.map(function (k) { return String(row[k] || "").trim(); }).filter(Boolean);

    if (oName || oPhones.length || oAddr.length || oMail) {
      var ow = el("div", "sowner");
      ow.appendChild(el("h4", null, t("ownerDetails")));
      if (oName) ow.appendChild(el("div", "onm", oName));
      oPhones.forEach(function (num) {
        var ln = el("div", "oline");
        var a = el("a", null, num); a.href = tel(num);
        ln.appendChild(a);
        ow.appendChild(ln);
      });
      if (oMail) {
        var l2 = el("div", "oline");
        var a2 = el("a", null, oMail); a2.href = "mailto:" + oMail;
        l2.appendChild(a2);
        ow.appendChild(l2);
      }
      oAddr.forEach(function (v) { ow.appendChild(el("div", "oline", v)); });
      oOther.forEach(function (v) { ow.appendChild(el("div", "oline", v)); });
      box.appendChild(ow);
    }

    var acts = actionRow(row, map, s, title);
    acts.className = "go sheet-go";
    box.appendChild(acts);

    wrap.appendChild(box);
    wrap.hidden = false;
    sheetOpen = true;
    document.documentElement.classList.add("noscroll");
    x.focus();
  }

  /* ---------------- side panel rows ---------------- */
  function sosRow(row, map) {
    var r = el("div", "prow");
    var name = String(row[map.name] || "—");
    r.appendChild(el("div", "pbadge", initials(name)));
    var i = el("div", "info");
    i.appendChild(el("div", "pname", name));
    var extra = map.rest.concat(map.place).map(function(k){return row[k];}).filter(Boolean).join(" · ");
    if (extra) i.appendChild(el("div", "pmeta", extra));
    var nums = map.phone.map(function(k){return String(row[k]||"").trim();}).filter(Boolean);
    if (nums.length) i.appendChild(el("div", "ptel", nums.join(" · ")));
    r.appendChild(i);
    if (nums.length) {
      var a = el("a", "iact call"); a.href = tel(nums[0]);
      a.setAttribute("aria-label", t("call") + " " + name);
      a.style.background = "var(--alert)"; a.style.color = "#fff";
      a.appendChild(svg(P.phone)); r.appendChild(a);
    }
    return r;
  }
  function docRow(row, map) {
    var file = String(row[map.file] || "").trim();
    var r = el("div", "prow");
    r.appendChild(el("div", "pbadge", ext(file).slice(0,4)));
    var i = el("div", "info");
    i.appendChild(el("div", "pname", String(row[map.name] || file || "Document")));
    var meta2 = map.rest.concat(map.place).map(function(k){
      return k === map.file ? "" : row[k];
    }).filter(Boolean).join(" · ");
    if (meta2) i.appendChild(el("div", "pmeta", meta2));
    r.appendChild(i);
    if (file) {
      var go = el("div", "go");
      if (OFFICE.test(file) || INLINE.test(file)) {
        var v = el("a", "iact alt");
        v.href = OFFICE.test(file)
          ? "https://view.officeapps.live.com/op/view.aspx?src=" + encodeURIComponent(absUrl(file))
          : file;
        v.target = "_blank"; v.rel = "noopener";
        v.setAttribute("aria-label", "View");
        v.appendChild(svg(P.doc)); go.appendChild(v);
      }
      var d = el("a", "iact alt"); d.href = file; d.setAttribute("download","");
      d.setAttribute("aria-label", "Download");
      d.appendChild(svg(P.down)); go.appendChild(d);
      r.appendChild(go);
    }
    return r;
  }

  /* ---------------- chrome ---------------- */
  function chrome() {
    // An unknown name leaves the default rather than producing an unstyled page.
    var THEMES = ["forest", "plum", "slate", "sunset", "ocean", "paper"];
    if (meta.theme && THEMES.indexOf(meta.theme) >= 0)
      document.documentElement.setAttribute("data-theme", meta.theme);
    else document.documentElement.removeAttribute("data-theme");
    var tcMeta = document.querySelector('meta[name=theme-color]');
    if (tcMeta) tcMeta.setAttribute("content", meta.theme === "paper" ? "#F5F7FB" : "#0A1628");
    var name = meta.name || "Society Directory";
    document.title = name;
    document.getElementById("brandName").textContent = name;
    document.getElementById("footName").textContent = name;
    var ini = name.trim().charAt(0).toUpperCase();
    document.getElementById("brandDot").textContent = ini;
    document.getElementById("footDot").textContent = ini;
    document.getElementById("heroEyebrow").textContent = meta.tagline || t("dir");
    qBox.placeholder = t("search");

    var lb = document.getElementById("langBtn");
    lb.textContent = t("other");
    lb.setAttribute("aria-label", t("otherName"));
    lb.title = t("otherName");
    lb.onclick = function () { setLang(lang === "hi" ? "en" : "hi"); };

    var h = document.getElementById("heroTitle");
    h.textContent = "";
    var parts = name.trim().split(/\s+/);
    var tail = parts.length > 1 ? parts.pop() : "";
    h.appendChild(document.createTextNode(parts.join(" ") + (tail ? " " : "")));
    if (tail) h.appendChild(el("span", "accent", tail));

    var addr = [meta.address, meta.city, meta.pincode].filter(Boolean).join(", ");
    document.getElementById("heroLede").textContent = addr ? addr + t("ledeAddr") : t("lede");
    document.getElementById("footAddr").textContent = addr;
    document.getElementById("footReg").textContent = meta.registration ? "Reg. " + meta.registration : "";

    var st = document.getElementById("heroStats");
    st.textContent = "";
    sections.slice(0, 4).forEach(function (s) {
      // An anchor, not a div: the count is the quickest way into a section,
      // and this makes it keyboard-reachable and long-pressable for free.
      var d = document.createElement("a");
      d.className = "stat";
      d.href = "#" + s.id;
      d.appendChild(el("div", "num", String(s.rows.length)));
      d.appendChild(el("div", "lbl", sectionTitle(s)));
      st.appendChild(d);
    });

    var nl = document.getElementById("navLinks"), fl = document.getElementById("footLinks");
    nl.textContent = ""; fl.textContent = "";
    sections.forEach(function (s) {
      var a = document.createElement("a");
      a.href = "#" + s.id; a.textContent = sectionTitle(s); a.dataset.id = s.id;
      nl.appendChild(a);
      var f = document.createElement("a");
      f.href = "#" + s.id; f.textContent = sectionTitle(s);
      fl.appendChild(f);
    });
    document.querySelector('.foot-col h5').textContent = t("sections");

    var sos = sections.filter(function(s){return s.sos;})[0];
    if (sos) {
      var cta = document.getElementById("sosCta");
      cta.hidden = false; cta.href = "#" + sos.id;
      cta.textContent = t("emergency");
    }

    var bn = document.getElementById("banner");
    bn.textContent = "";
    var conf = (lang === "hi" && meta.confidentialHi) || meta.confidential;
    if (conf) {
      var b = el("div", "banner");
      b.appendChild(svg(P.lock));
      var txt = el("div");
      txt.appendChild(el("b", null, t("membersOnly")));
      txt.appendChild(document.createTextNode(conf));
      b.appendChild(txt);
      bn.appendChild(b);
    }
    document.getElementById("searchbar").hidden = false;
  }

  /* ---------------- render ---------------- */
  function filtered(s, term) {
    if (!term) return s.rows;
    return s.rows.filter(function (r) {
      return s.cols.map(function(c){return r[c];})
        .filter(Boolean).join(" ").toLowerCase().indexOf(term) !== -1;
    });
  }
  function head(title, count, tag) {
    var h = el("div", "sec-head");
    h.appendChild(el("h2", null, title));
    h.appendChild(el("span", "n", String(count)));
    if (tag) h.appendChild(el("span", "tag", tag));
    return h;
  }

  /* Every card is built once. Typing then hides and shows what is already
     there, instead of rebuilding the page — a rebuild changes the document
     height on each keystroke, which makes the browser jump back to the top. */
  var built = [];
  var emptyEl = null;

  function openState(id) {
    try {
      var raw = localStorage.getItem("dir-open");
      if (raw) { var m = JSON.parse(raw); if (m && id in m) return !!m[id]; }
    } catch (e) {}
    return null;                       // nothing remembered yet
  }
  function rememberOpen(id, open) {
    try {
      var m = {};
      try { m = JSON.parse(localStorage.getItem("dir-open") || "{}") || {}; } catch (e) {}
      m[id] = open;
      localStorage.setItem("dir-open", JSON.stringify(m));
    } catch (e) {}
  }

  function draw() {
    // The back bar and the tile grid live in the markup, so hold on to them
    // across the clear rather than rebuilding them from scratch.
    var vbarEl = document.getElementById("vbar");
    var tilesEl = document.getElementById("tiles");
    mainEl.textContent = ""; sosEl.textContent = ""; docsEl.textContent = "";
    mainEl.appendChild(vbarEl); mainEl.appendChild(tilesEl);
    built = []; emptyEl = null;

    sections.forEach(function (s) {
      if (s.sos) {                       // → sidebar, emergency panel
        if (!s.rows.length) return;
        var p = el("section", "panel alarm reveal");
        p.id = s.id;
        var hSos = el("h3"); hSos.appendChild(svg(P.alert));
        hSos.appendChild(el("span", null, sectionTitle(s)));
        p.appendChild(hSos);
        p.appendChild(el("div", "cap", t("tapCall")));
        var sItems = s.rows.map(function (row) {
          var node = sosRow(row, s.map);
          p.appendChild(node);
          return { el: node, hay: hayOf(s, row) };
        });
        sosEl.appendChild(p);
        // The emergency panel has a page of its own and also sits on home,
        // because a number you need in a hurry should never be two taps away.
        built.push({ el: p, viewId: s.id, panel: true, items: sItems, count: null, grid: null });
        return;
      }
      // A notice may carry an attachment; that does not make it a document
      // library, so it must not be diverted to the sidebar.
      if (s.map.file && !s.notice) {     // → sidebar, documents panel
        if (!s.rows.length) return;
        var d = el("section", "panel docs reveal");
        d.id = s.id;
        var hDoc = el("h3"); hDoc.appendChild(svg(P.doc));
        hDoc.appendChild(el("span", null, sectionTitle(s)));
        var dChev = svg("M7 10l5 5 5-5", true);
        dChev.setAttribute("class", "sec-chev");
        hDoc.appendChild(dChev);
        d.appendChild(hDoc);
        var cap = el("div", "cap");
        d.appendChild(cap);

        // Documents are the least urgent thing here, so the list stays shut
        // until asked for; the count tells you whether it is worth opening.
        var dBody = el("div", "pbody");
        var dItems = s.rows.map(function (row) {
          var node = docRow(row, s.map);
          dBody.appendChild(node);
          return { el: node, hay: hayOf(s, row) };
        });
        d.appendChild(dBody);
        docsEl.appendChild(d);

        if (openState(s.id) !== true) d.classList.add("closed");
        hDoc.setAttribute("role", "button");
        hDoc.setAttribute("tabindex", "0");
        hDoc.setAttribute("aria-expanded", d.classList.contains("closed") ? "false" : "true");
        var dToggle = function () {
          var shut = d.classList.toggle("closed");
          hDoc.setAttribute("aria-expanded", shut ? "false" : "true");
          rememberOpen(s.id, !shut);
        };
        hDoc.addEventListener("click", dToggle);
        hDoc.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); dToggle(); }
        });

        built.push({ el: d, viewId: s.id, panel: true, head: hDoc, items: dItems,
                     count: cap, isDocs: true, grid: null });
        return;
      }

      var sec = el("section", "sec reveal");
      sec.id = s.id;
      var h = head(sectionTitle(s), s.rows.length, null);
      var chev = svg("M7 10l5 5 5-5", true);
      chev.setAttribute("class", "sec-chev");
      h.appendChild(chev);
      sec.appendChild(h);

      var note = (lang === "hi" && sectionNotes["hi:" + key(s.title)]) || sectionNotes[key(s.title)];
      if (note) {
        var n = el("div", "secnote");
        n.appendChild(svg(P.alert));
        n.appendChild(el("div", null, note));
        sec.appendChild(n);
      }

      var g = el("div", s.notice ? "nlist" : "cgrid");
      var items = s.rows.map(function (row) {
        var card = s.notice ? noticeCard(row, s.map) : contact(row, s.map, false, "", s);
        g.appendChild(card);
        // face = what the compact card actually shows. Anything matched
        // outside it needs saying, or the card looks like a stray result.
        return {
          el: card, hay: hayOf(s, row),
          face: card.textContent.toLowerCase(),
          hint: card.querySelector(".cmatch"),
          pairs: s.cols.map(function (k) {
            return { k: k, v: String(row[k] || "").trim() };
          }).filter(function (p) { return p.v; })
        };
      });
      sec.appendChild(g);
      mainEl.appendChild(sec);

      // No accordion any more: a section is its own page, so there is nothing
      // above or below it to fold away from.
      built.push({ el: sec, viewId: s.id, items: items,
                   count: h.querySelector(".n"), grid: g });
    });

    emptyEl = el("div", "empty", t("empty"));
    emptyEl.hidden = true;
    mainEl.appendChild(emptyEl);

    drawTiles();
    drawTabs();
    showView(viewFromHash(), true);
    reveals(); spy();
  }

  /* ---------------- home, tabs, and one-section views ---------------- */

  /** Sections that get a tile and a page of their own. */
  function pageSections() {
    return sections.filter(function (s) { return s.rows.length; });
  }
  function sectionById(id) {
    return pageSections().filter(function (s) { return s.id === id; })[0] || null;
  }
  function viewFromHash() {
    var want = (location.hash || "").slice(1);
    return sectionById(want) ? want : "home";
  }

  function drawTiles() {
    var box = document.getElementById("tiles");
    box.textContent = "";
    pageSections().forEach(function (s) {
      var a = document.createElement("a");
      a.className = "tile" + (s.sos ? " urgent" : "");
      a.href = "#" + s.id;
      var ic = el("div", "ticon");
      ic.appendChild(svg(sectionIcon(s)));
      a.appendChild(ic);
      a.appendChild(el("div", "tname", sectionTitle(s)));
      a.appendChild(el("div", "tcount", s.rows.length + " " +
        (s.rows.length === 1 ? t("entry") : t("entries"))));
      // No click handler: the href carries the section and the hash is the
      // state. A listener that fails to fire would leave the tile dead; a
      // plain anchor cannot.
      box.appendChild(a);
    });
  }

  /* Home, then the emergency section if there is one, then whatever comes
     first — five is as many as fit across a phone without shrinking the
     labels past reading. */
  function tabSections() {
    var all = pageSections();
    var sos = all.filter(function (s) { return s.sos; });
    var rest = all.filter(function (s) { return !s.sos; });
    return sos.concat(rest).slice(0, 4);
  }
  function drawTabs() {
    var bar = document.getElementById("tabbar");
    bar.textContent = "";
    var add = function (id, label, path, cls) {
      var a = document.createElement("a");
      a.className = cls || "";
      a.href = "#" + id;
      a.dataset.view = id;
      a.appendChild(svg(path));
      a.appendChild(el("span", "tlbl", label));
      bar.appendChild(a);
    };
    add("home", t("home"), P.home);
    tabSections().forEach(function (s) {
      add(s.id, sectionTitle(s), sectionIcon(s), s.sos ? "sos" : "");
    });
  }

  function drawBackBar() {
    var bar = document.getElementById("vbar");
    bar.textContent = "";
    var a = document.createElement("a");
    a.className = "vback";
    a.href = "#home";
    a.appendChild(svg(P.back));
    a.appendChild(el("span", null, t("home")));
    bar.appendChild(a);

    // The whole directory, reachable from wherever you are.
    var strip = el("div", "vnav");
    var here = null;
    pageSections().forEach(function (s) {
      var c = document.createElement("a");
      c.className = "vchip" + (s.id === view ? " on" : "");
      c.href = "#" + s.id;
      c.textContent = sectionTitle(s);
      if (s.id === view) here = c;
      strip.appendChild(c);
    });
    bar.appendChild(strip);
    // Bring the section you are in into view, or it can sit off the right edge.
    if (here && typeof here.offsetLeft === "number")
      strip.scrollLeft = Math.max(0, here.offsetLeft - 48);
  }

  /** Renders whatever the hash says. Never called to *navigate* — the links do
      that themselves — so it never writes to history, and the browser's back
      button walks the sections for free. applyFilter decides what the view
      means for each section, so visibility has exactly one owner. */
  function showView(id, initial) {
    view = sectionById(id) ? id : "home";
    drawBackBar();
    var mark = function (box, attr) {
      if (!box) return;
      Array.prototype.forEach.call(box.children, function (a) {
        a.classList.toggle("on", (a.dataset && a.dataset[attr]) === view);
      });
    };
    mark(document.getElementById("tabbar"), "view");
    mark(document.getElementById("navLinks"), "id");
    applyFilter();
    // Landing mid-page after switching would hide the top of the new section.
    // Instant, not smooth: html has scroll-behavior:smooth, and animating a
    // long way while the content underneath is being swapped reads as the page
    // having frozen. A page change should just be there.
    if (!initial && (window.scrollY || window.pageYOffset || 0) > 0) {
      try { window.scrollTo({ top: 0, behavior: "instant" }); }
      catch (e) { window.scrollTo(0, 0); }
    }
  }

  /** Everything searchable about one row, lowercased once at build time. */
  function hayOf(s, row) {
    return s.cols.map(function (c) { return row[c]; })
      .filter(Boolean).join(" ").toLowerCase();
  }

  function applyFilter() {
    var term = qBox.value.trim().toLowerCase();
    var total = 0;

    built.forEach(function (b) {
      var shown = 0;
      b.items.forEach(function (it) {
        var hit = !term || it.hay.indexOf(term) !== -1;
        it.el.hidden = !hit;
        if (hit) shown++;
        // The detail is in the sheet now, so a card matched on something the
        // compact face does not show says which field it was.
        if (it.hint) {
          var why = "";
          if (term && hit && it.face.indexOf(term) === -1) {
            for (var i = 0; i < it.pairs.length; i++) {
              if (it.pairs[i].v.toLowerCase().indexOf(term) !== -1) {
                why = it.pairs[i].k + ": " + it.pairs[i].v;
                break;
              }
            }
          }
          it.hint.textContent = why;
          it.hint.hidden = !why;
        }
      });
      total += shown;
      // Searching cuts across the whole directory — it would be useless if it
      // only looked inside the section you happen to be standing in. So a
      // search shows every section with a hit; browsing shows just this one.
      b.el.hidden = term
        ? shown === 0
        : b.viewId !== view;
      // Sections carry .reveal, which starts at opacity:0 and waits for an
      // IntersectionObserver to add .in. A section observed while display:none
      // may never get that callback, so switching to it would show a blank
      // page. Anything put on screen here is revealed outright.
      if (!b.el.hidden) b.el.classList.add("in");
      if (b.count) {
        b.count.textContent = b.isDocs
          ? shown + " " + (shown === 1 ? t("file") : t("files")) + " " + t("toView")
          : String(shown);
      }
    });

    // Home is the index, so its tiles give way to results while searching.
    var tilesEl = document.getElementById("tiles");
    var vbarEl = document.getElementById("vbar");
    if (tilesEl) tilesEl.hidden = !!term || view !== "home";
    if (vbarEl) vbarEl.hidden = !!term || view === "home";

    // An empty sidebar column would otherwise hold its 330px open on desktop.
    var sideEl = document.querySelector(".side");
    if (sideEl) {
      var anyPanel = built.some(function (b) { return b.panel && !b.el.hidden; });
      sideEl.hidden = !anyPanel;
      var lay = document.querySelector(".layout");
      if (lay) lay.classList.toggle("solo", !anyPanel);
    }

    if (emptyEl) {
      emptyEl.hidden = total !== 0;
      emptyEl.textContent = term
        ? t("noMatch") + " “" + qBox.value.trim() + "”."
        : t("empty");
    }
  }

  qBox.addEventListener("input", applyFilter);

  /* Clearing a search on a phone otherwise means holding backspace. */
  var qClear = document.getElementById("qClear");
  if (qClear) {
    qClear.addEventListener("click", function () {
      qBox.value = "";
      applyFilter();
      qBox.focus();
    });
    qBox.addEventListener("input", function () { qClear.hidden = !qBox.value; });
  }

  function reveals() {
    // Everything with .reveal starts at opacity:0 and is only shown once the
    // observer says it is on screen. With no observer that is the whole page,
    // permanently blank — so fade-in is a bonus, not a requirement.
    if (!window.IntersectionObserver) {
      Array.prototype.forEach.call(document.querySelectorAll(".reveal"),
        function (n) { n.classList.add("in"); });
      return;
    }
    var io = new IntersectionObserver(function (rows) {
      rows.forEach(function (r) {
        if (r.isIntersecting) { r.target.classList.add("in"); io.unobserve(r.target); }
      });
    }, { rootMargin: "0px 0px -6% 0px" });
    document.querySelectorAll(".reveal:not(.in)").forEach(function (n) { io.observe(n); });
  }
  function spy() {
    var links = document.querySelectorAll("#navLinks a");
    if (!links.length) return;
    var io = new IntersectionObserver(function (rows) {
      rows.forEach(function (r) {
        if (!r.isIntersecting) return;
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === r.target.id); });
      });
    }, { rootMargin: "-" + (60 + 60) + "px 0px -60% 0px" });
    document.querySelectorAll("section[id]").forEach(function (s) { io.observe(s); });
  }
  addEventListener("scroll", function () {
    var h = document.documentElement;
    var p = h.scrollTop / ((h.scrollHeight - h.clientHeight) || 1);
    document.getElementById("railFill").style.height = Math.min(100, p * 100) + "%";
  }, { passive: true });

  var toggle = document.getElementById("navToggle"), navLinks = document.getElementById("navLinks");
  toggle.onclick = function () {
    var open = navLinks.classList.toggle("open");
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  };
  navLinks.addEventListener("click", function (e) {
    if (e.target.tagName === "A") {
      navLinks.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
      // The link's own href carries the section; nothing to intercept.
    }
  });
  document.getElementById("shareBtn").onclick = function () {
    if (location.protocol === "file:") {
      alert("This page is open as a local file. Publish it, then share the web address.");
      return;
    }
    var url = location.origin + location.pathname;
    if (navigator.share) { navigator.share({ title: document.title, url: url }).catch(function(){}); return; }
    navigator.clipboard.writeText(url)
      .then(function(){ alert("Link copied:\n" + url); })
      .catch(function(){ prompt("Copy this link:", url); });
  };

  function parse(buf) {
    var wb = XLSX.read(buf, { type: "array" });
    sections = []; meta = {}; sectionNotes = {}; sectionHindi = {};
    wb.SheetNames.forEach(function (name) {
      // A leading underscore marks data that is collected but never published:
      // dates of birth, landlord contacts, anything not for the noticeboard.
      if (name.charAt(0) === "_") return;

      var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval:"", raw:false })
        .filter(function (r) {
          return Object.keys(r).some(function (k) { return String(r[k]).trim() !== ""; });
        });
      if (!rows.length) return;
      var cols = Object.keys(rows[0]).filter(function (c) { return c.charAt(0) !== "_"; });
      if (!cols.length) return;
      if (/^(about|society|info|details|header)$/i.test(name) && cols.length >= 2) {
        rows.forEach(function (r) {
          var raw = String(r[cols[0]]).trim();
          var v = String(r[cols[1]]).trim();

          // "Note HI: <Section>" — Hindi wording of a caveat. Checked first,
          // otherwise the generic note rule would swallow it.
          var nh = raw.match(/^note\s*(?:hi|hindi|हिंदी)\s*[:\-]\s*(.+)$/i);
          if (nh) { if (v) sectionNotes["hi:" + key(nh[1])] = v; return; }

          // "Note: Services & Help" attaches a caveat to that section.
          var m = raw.match(/^note\s*[:\-]\s*(.+)$/i);
          if (m) { if (v) sectionNotes[key(m[1])] = v; return; }

          // "Hindi: Services & Help" renames that section when Hindi is on.
          var hm = raw.match(/^(?:hindi|हिंदी)\s*[:\-]\s*(.+)$/i);
          if (hm) { if (v) sectionHindi[key(hm[1])] = v; return; }

          var k = raw.toLowerCase().replace(/[^a-z]/g,"");
          if (/^(confidentialhi|confidentialnoticehi)$/.test(k)) { meta.confidentialHi = v; return; }
          if (/^(confidential|confidentialnotice|privacynotice|sharingnotice)$/.test(k)) {
            meta.confidential = v; return;
          }
          if (/^(societyname|name)$/.test(k)) meta.name = v;
          else if (/tagline|subtitle/.test(k)) meta.tagline = v;
          else if (/^address/.test(k)) meta.address = v;
          else if (/^city/.test(k)) meta.city = v;
          else if (/pin|zip/.test(k)) meta.pincode = v;
          else if (/^reg/.test(k)) meta.registration = v;
          else if (/logo/.test(k)) meta.logo = v;
          else if (/^theme$/.test(k)) meta.theme = v.toLowerCase().trim();
          else if (/^(sharing|sharecontacts|allowsharing)$/.test(k)) meta.sharing = v;
          else if (/^(country|countrycode|dialcode|isd)$/.test(k)) meta.country = v;
        });
        return;
      }
      if (isNotice(name)) {
        var nMap = noticeMap(cols);
        sections.push({
          id: slug(name), title: name, cols: cols, notice: true,
          map: nMap, rows: noticeOrder(rows, nMap), sos: false
        });
        return;
      }
      sections.push({
        id: slug(name), title: name, rows: rows, cols: cols,
        map: classify(cols), sos: /emerg|sos|urgent|on.?call|helpline|24x7/i.test(name)
      });
    });
    if (!sections.length) throw new Error("No usable sheets found.");
    // Notices sit at the end of the page, below the contact sections, wherever
    // the tab happens to sit in the workbook.
    sections.sort(function (a, b) { return (a.notice ? 1 : 0) - (b.notice ? 1 : 0); });
    chrome(); draw();
    document.getElementById("footUpd").textContent =
      t("updated") + " " + new Date().toLocaleDateString(lang==="hi"?"hi-IN":undefined,{day:"numeric",month:"short",year:"numeric"});
    // The browser back button should move between sections, not off the site.
    addEventListener("hashchange", function () { closeSheet(); showView(viewFromHash()); });
    addEventListener("keydown", function (e) {
      if (sheetOpen && (e.key === "Escape" || e.key === "Esc")) closeSheet();
    });
  }
  function fail(msg) {
    document.getElementById("heroTitle").textContent = "Society Directory";
    mainEl.textContent = "";
    var f = el("div", "fallback");
    f.appendChild(el("h2", null, t("loadFail")));
    // No link to the data file here either — a failed load is not a reason to
    // hand a visitor the raw spreadsheet.
    f.appendChild(el("p", null, msg));
    mainEl.appendChild(f);
  }

  fetch(DATA_FILE + "?v=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
    .then(function (b) { parse(new Uint8Array(b)); })
    .catch(function (e) {
      fail(location.protocol === "file:"
        ? "Browsers block reading local files directly, so open the published address instead."
        : "Could not read " + DATA_FILE + " (" + (e.message || e) + ").");
    });
  reveals();
})();
</script>
</body>
</html>
