<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Society Directory</title>
<meta name="description" content="Committee, emergency numbers, service contacts, resident directory and society documents — all in one place.">
<meta property="og:type" content="website">
<meta property="og:title" content="Society Directory">
<meta property="og:description" content="Committee, emergency numbers, service contacts, residents and documents — one page, always current.">
<meta name="theme-color" content="#0A1628">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230EA5C8'/%3E%3Cstop offset='1' stop-color='%23E0A81E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7l8 6v12H8V13z' fill='%230A1628'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1628; --navy-2:#0F1E36; --navy-3:#152242;
    --teal:#0EA5C8; --teal-bright:#22C3E6; --gold:#E0A81E; --alert:#F2555A;
    --line:rgba(255,255,255,.10); --muted:#8CA0B8;
    --tap:44px; --navh:60px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--navy);color:#E8EEF6;
    line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1220px;margin:0 auto;padding:0 16px}
  @media(min-width:700px){ .wrap{padding:0 24px} }

  .rail{position:fixed;left:0;top:0;height:100vh;width:3px;background:var(--line);z-index:60}
  .rail-fill{width:100%;height:0;background:linear-gradient(var(--teal),var(--gold));transition:height .1s linear}

  /* ── Nav ── */
  nav{position:sticky;top:0;z-index:50;background:rgba(10,22,40,.88);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:var(--navh);gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:600;
    font-size:15px;min-width:0}
  .brand .dot{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal),var(--gold));color:var(--navy);font-size:13px;font-weight:700}
  .brand .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-links{display:flex;gap:22px;font-size:13.5px;color:var(--muted)}
  .nav-links a{transition:color .2s;white-space:nowrap}
  .nav-links a:hover,.nav-links a.on{color:var(--teal-bright)}
  .nav-right{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .nav-cta{font-size:13px;font-weight:600;color:#fff;background:var(--alert);
    padding:9px 14px;border-radius:8px;transition:.18s;white-space:nowrap}
  .nav-cta:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;width:37px;height:37px;
    display:grid;place-items:center;cursor:pointer;color:#E8EEF6;flex-shrink:0;transition:.2s}
  .icon-btn:hover{border-color:var(--teal);color:var(--teal-bright)}
  .icon-btn svg{width:18px;height:18px}
  .nav-toggle{display:none}
  .nav-toggle .x{display:none}
  .nav-toggle[aria-expanded="true"] .x{display:block}
  .nav-toggle[aria-expanded="true"] .bars{display:none}
  @media(max-width:980px){
    .nav-toggle{display:grid}
    .nav-links{position:absolute;top:var(--navh);left:0;right:0;flex-direction:column;gap:0;display:none;
      background:rgba(10,22,40,.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
      padding:6px 20px 14px;max-height:70vh;overflow-y:auto}
    .nav-links.open{display:flex}
    .nav-links a{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
    .nav-links a:last-child{border-bottom:none}
  }
  @media(max-width:430px){ .brand .bn{display:none} .nav-cta{padding:9px 11px} }

  /* ── Hero (tightened) ── */
  .hero{position:relative;padding:40px 0 34px;overflow:hidden}
  @media(min-width:700px){ .hero{padding:58px 0 46px} }
  .hero-glow{position:absolute;top:-40%;right:-8%;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle,rgba(14,165,200,.17),transparent 62%);pointer-events:none}
  .hero-glow-2{position:absolute;bottom:-50%;left:-14%;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle,rgba(224,168,30,.10),transparent 62%);pointer-events:none}
  .hero .wrap{position:relative;z-index:1}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--teal-bright);margin-bottom:16px;
    border:1px solid var(--line);padding:6px 13px;border-radius:100px;background:rgba(14,165,200,.06)}
  .eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,165,200,.5)}70%{box-shadow:0 0 0 8px rgba(14,165,200,0)}100%{box-shadow:0 0 0 0 rgba(14,165,200,0)}}
  .hero h1{font-size:clamp(27px,5.2vw,46px);font-weight:700;line-height:1.06;margin-bottom:12px}
  .hero h1 .accent{background:linear-gradient(100deg,var(--teal-bright),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.lede{font-size:15px;color:var(--muted);max-width:640px;margin-bottom:22px}
  .hero-stats{display:flex;gap:26px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
  @media(min-width:700px){ .hero-stats{gap:38px} }
  .stat .num{font-family:'Space Grotesk';font-size:25px;font-weight:700;color:#fff;line-height:1}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}

  /* ── Search ── */
  .searchbar{position:sticky;top:var(--navh);z-index:45;background:rgba(10,22,40,.94);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);padding:10px 0}
  .sfield{position:relative;display:flex;align-items:center}
  .sfield>svg{position:absolute;left:14px;width:16px;height:16px;color:var(--muted);pointer-events:none}
  .sfield input{width:100%;font:inherit;font-size:16px;color:#E8EEF6;min-height:var(--tap);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px 10px 41px;transition:.2s}
  .sfield input::placeholder{color:var(--muted)}
  .sfield input:focus{outline:none;border-color:var(--teal);background:rgba(14,165,200,.07)}

  /* ── Two-column layout ── */
  .layout{display:flex;flex-direction:column;gap:16px;padding:26px 0 44px}
  .side{display:contents}          /* phones: panels become siblings, orderable */
  .main{order:1;min-width:0}
  .p-sos{order:0}                  /* emergency first on a phone */
  .p-docs{order:2}
  @media(min-width:1000px){
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start;
      padding:30px 0 56px}
    .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(var(--navh) + 66px)}
    .main,.side>*{order:0}
  }

  /* ── Section head (compact) ── */
  .sec{margin-bottom:26px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .sec-head h2{font-size:15px;font-weight:600;letter-spacing:.02em}
  .sec-head .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sec-head .tag{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--teal)}

  /* ── Compact contact card ── */
  /* Cards size to their content — nothing is clipped or ellipsised. */
  .cgrid{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
  @media(min-width:620px){ .cgrid{grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:12px} }
  .ccard{display:block;padding:13px 14px;border-radius:12px;min-width:0;
    background:var(--navy-2);border:1px solid var(--line);
    transition:border-color .18s,transform .18s,background .18s}
  .ccard:hover{border-color:rgba(14,165,200,.45);transform:translateY(-2px);background:var(--navy-3)}

  .chead{display:flex;align-items:flex-start;gap:11px}
  .av{width:38px;height:38px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;
    overflow:hidden;font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--navy);
    background:linear-gradient(135deg,var(--teal),var(--teal-bright))}
  .av img{width:100%;height:100%;object-fit:cover}
  .cid{flex:1;min-width:0}
  .nm{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
  .role{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-top:2px;line-height:1.4}
  .rate{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--gold);white-space:nowrap;
    background:rgba(224,168,30,.13);border:1px solid rgba(224,168,30,.30);
    padding:3px 8px;border-radius:7px;margin-top:1px}

  .cdet{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px;overflow-wrap:anywhere}
  .cdet b{color:#C4D2E4;font-weight:600}

  .cfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
  .tel{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;color:var(--teal-bright);
    font-variant-numeric:tabular-nums;line-height:1.4;overflow-wrap:anywhere}
  .tel:hover{text-decoration:underline}
  .go{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
  .iact{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;
    transition:.18s;-webkit-tap-highlight-color:transparent}
  .iact svg{width:15px;height:15px}
  .iact.call{background:var(--teal);color:var(--navy)}
  .iact.call:hover{background:var(--teal-bright);transform:scale(1.06)}
  .iact.alt{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
  .iact.alt:hover{color:var(--teal-bright);border-color:var(--teal)}

  .ccard.sos{border-color:rgba(242,85,90,.42);
    background:linear-gradient(150deg,rgba(242,85,90,.13),var(--navy-2))}
  .ccard.sos .av{background:linear-gradient(135deg,var(--alert),var(--gold));color:#fff}
  .ccard.sos .tel{color:#FF9198}
  .ccard.sos .iact.call{background:var(--alert);color:#fff}

  /* ── Side panels ── */
  .panel{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
  .panel.alarm{border-color:rgba(242,85,90,.38);
    background:linear-gradient(165deg,rgba(242,85,90,.11),var(--navy-2))}
  .panel h3{font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    color:var(--teal);margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .panel.alarm h3{color:var(--alert)}
  .panel h3 svg{width:14px;height:14px}
  .panel .cap{font-size:11.5px;color:var(--muted);margin-bottom:11px}
  .prow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
  .prow .info{flex:1;min-width:0}
  .prow .iact{margin-top:2px}
  .prow:last-child{border-bottom:none;padding-bottom:0}
  .prow:first-of-type{padding-top:0}
  .pbadge{width:32px;height:32px;flex-shrink:0;border-radius:8px;display:grid;place-items:center;
    font-family:'Space Grotesk';font-size:10px;font-weight:700;letter-spacing:.02em;
    color:var(--gold);background:rgba(224,168,30,.13);border:1px solid rgba(224,168,30,.28)}
  .panel.alarm .pbadge{color:#fff;background:linear-gradient(135deg,var(--alert),var(--gold));
    border:none;font-size:12.5px}
  .pname{font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
  .pmeta{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:1px;overflow-wrap:anywhere}
  .ptel{font-size:12.5px;font-weight:600;color:#FF9198;font-variant-numeric:tabular-nums;
    margin-top:2px;overflow-wrap:anywhere}
  .panel .more{display:block;margin-top:11px;font-size:12px;color:var(--teal-bright);text-align:center}

  .empty{padding:26px 16px;text-align:center;color:var(--muted);
    border:1px dashed var(--line);border-radius:12px;font-size:14px}

  /* ── Footer ── */
  footer{background:var(--navy);border-top:1px solid var(--line);padding:34px 0 30px}
  .foot-grid{display:flex;justify-content:space-between;gap:26px;flex-wrap:wrap;margin-bottom:22px}
  .foot-brand{max-width:320px}
  .foot-brand p{font-size:13.5px;color:var(--muted);margin-top:10px}
  .foot-col h5{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    margin-bottom:10px;font-weight:600}
  .foot-col a{display:block;font-size:14px;color:#C4D2E4;margin-bottom:8px;transition:color .2s}
  .foot-col a:hover{color:var(--teal-bright)}
  .foot-bottom{border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--muted);
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .credit{margin-left:auto}
  .credit b{font-weight:600;color:#C4D2E4}

  .reveal{opacity:0;transform:translateY(14px);
    transition:opacity .5s cubic-bezier(.2,.7,.3,1),transform .5s cubic-bezier(.2,.7,.3,1)}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;transition:none}.pulse{animation:none}html{scroll-behavior:auto}
  }
  a:focus-visible,button:focus-visible,input:focus-visible{
    outline:2px solid var(--teal-bright);outline-offset:2px;border-radius:6px}
  .fallback{max-width:620px;margin:0 auto;padding:60px 24px;text-align:center;color:var(--muted)}
  .fallback h2{color:#fff;margin-bottom:12px;font-size:22px}
  .fallback a{color:var(--teal-bright);text-decoration:underline}
</style>
</head>
<body>
<div class="rail"><div class="rail-fill" id="railFill"></div></div>

<noscript>
  <div class="fallback"><h2>This page needs JavaScript</h2>
  <p>The directory is built from a spreadsheet in the browser. You can still
  <a href="data.xlsx">download the data file</a>.</p></div>
</noscript>

<nav>
  <div class="wrap nav-inner">
    <a href="#top" class="brand"><span class="dot" id="brandDot">S</span><span class="bn" id="brandName">Directory</span></a>
    <div class="nav-links" id="navLinks"></div>
    <div class="nav-right">
      <a href="#" class="nav-cta" id="sosCta" hidden>Emergency</a>
      <button class="icon-btn" id="shareBtn" title="Share this page" aria-label="Share this page">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16a3 3 0 00-2 .8l-7-4a3 3 0 000-1.6l7-4A3 3 0 1015 5l-7 4a3 3 0 100 6l7 4a3 3 0 103-3z"/></svg>
      </button>
      <button class="icon-btn nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="Menu">
        <svg class="bars" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="hero-glow"></div><div class="hero-glow-2"></div>
  <div class="wrap">
    <div class="eyebrow reveal"><span class="pulse"></span><span id="heroEyebrow">Resident Directory</span></div>
    <h1 class="reveal" id="heroTitle">Loading…</h1>
    <p class="lede reveal" id="heroLede"></p>
    <div class="hero-stats reveal" id="heroStats"></div>
  </div>
</header>

<div class="searchbar" id="searchbar" hidden>
  <div class="wrap">
    <div class="sfield">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 3a7 7 0 105.3 11.6l4 4 1.4-1.4-4-4A7 7 0 0010 3zm0 2a5 5 0 110 10 5 5 0 010-10z"/></svg>
      <input id="q" type="search" placeholder="Search a name, flat, phone or document…">
    </div>
  </div>
</div>

<div class="wrap">
  <div class="layout">
    <main class="main" id="main"></main>
    <div class="side">
      <aside class="p-sos" id="pSos"></aside>
      <aside class="p-docs" id="pDocs"></aside>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div class="foot-brand">
        <div class="brand"><span class="dot" id="footDot">S</span><span id="footName">Directory</span></div>
        <p id="footAddr"></p>
      </div>
      <div class="foot-col"><h5>Sections</h5><div id="footLinks"></div></div>
      <div class="foot-col"><h5>Manage</h5>
        <a href="admin.html">Admin panel</a>
        <a href="data.xlsx">Download the data file</a>
      </div>
    </div>
    <div class="foot-bottom">
      <span id="footReg"></span>
      <span id="footUpd"></span>
      <span class="credit"><b>Stunity Tech</b> · by Prateek</span>
    </div>
  </div>
</footer>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";
  var DATA_FILE = "data.xlsx";
  var mainEl = document.getElementById("main"),
      sosEl  = document.getElementById("pSos"),
      docsEl = document.getElementById("pDocs"),
      qBox   = document.getElementById("q");
  var sections = [], meta = {};

  var P = {
    phone:"M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z",
    mail:"M3 5h18v14H3V5zm2 2v.5l7 4.5 7-4.5V7H5zm0 2.9V17h14V9.9l-7 4.5-7-4.5z",
    down:"M12 3v10.2l3.6-3.6L17 11l-5 5-5-5 1.4-1.4L12 13.2V3zM5 19h14v2H5v-2z",
    alert:"M12 2L1 21h22L12 2zm0 5l7.5 12.9h-15L12 7zm-1 4v4h2v-4h-2zm0 5v2h2v-2h-2z",
    doc:"M6 2h8l4 4v16H6V2zm7 1.5V7h3.5L13 3.5zM8 12h8v2H8v-2zm0 4h8v2H8v-2z"
  };
  function svg(d, stroke) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    if (stroke) { s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","2.3"); }
    else s.setAttribute("fill", "currentColor");
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); s.appendChild(p); return s;
  }
  // Spreadsheet values are only ever set with textContent, never as markup.
  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x != null && x !== "") n.textContent = x;
    return n;
  }
  function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"s";}
  function initials(n) {
    var p = String(n || "?").trim().split(/\s+/).filter(Boolean);
    if (!p.length) return "?";
    return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
  }
  function isUrl(v){ return /^https?:\/\//i.test(String(v || "").trim()); }
  function tel(v){ return "tel:" + String(v).replace(/[^\d+]/g, ""); }

  var OFFICE=/\.(docx?|xlsx?|pptx?)$/i, INLINE=/\.(pdf|png|jpe?g|gif|webp|svg|txt)$/i;
  function fileCol(cols) {
    for (var i=0;i<cols.length;i++)
      if (/^(file|link|url|document|attachment|path|download)$/
          .test(cols[i].toLowerCase().replace(/[^a-z]/g,""))) return cols[i];
    return null;
  }
  function classify(cols) {
    var r = { name:null, phone:[], email:null, role:null, photo:null, file:null,
              rate:null, place:[], rest:[] };
    r.file = fileCol(cols);
    cols.forEach(function (c) {
      var k = c.toLowerCase().replace(/[^a-z]/g, "");
      if (c === r.file) return;
      if (!r.rate && /^(charge|charges|rate|rates|fee|fees|price|cost|amount|visitcharge|chargespervisit|perisit|monthlycharge)$/.test(k)) r.rate = c;
      else if (!r.photo && /^(photo|image|picture|avatar|pic|img|photourl)$/.test(k)) r.photo = c;
      else if (!r.name && /^(name|fullname|membername|residentname|person|service|label|item|title|contactperson)$/.test(k)) r.name = c;
      else if (/phone|mobile|cell|tel|contactno|number/.test(k)) r.phone.push(c);
      else if (!r.email && /email|mail/.test(k)) r.email = c;
      else if (!r.role && /^(role|designation|post|type|position|category)$/.test(k)) r.role = c;
      else if (/flat|unit|door|block|wing|tower|house|floor|address/.test(k)) r.place.push(c);
      else r.rest.push(c);
    });
    if (!r.name) {
      var pool = cols.filter(function (c) {
        return r.phone.indexOf(c)<0 && c!==r.email && c!==r.role &&
               c!==r.photo && c!==r.file && c!==r.rate;
      });
      r.name = pool[0] || cols[0];
      r.rest = r.rest.filter(function(c){return c!==r.name;});
      r.place = r.place.filter(function(c){return c!==r.name;});
    }
    return r;
  }
  function ext(p){var m=String(p).split("?")[0].match(/\.([a-z0-9]+)$/i);return m?m[1].toUpperCase():"FILE";}
  function absUrl(p){
    if(/^https?:\/\//i.test(p))return p;
    return location.origin+location.pathname.replace(/[^/]*$/,"")+p.replace(/^\.?\//,"");
  }

  /* ---------------- compact contact card ---------------- */
  function contact(row, map, sos) {
    var c = el("div", "ccard" + (sos ? " sos" : ""));
    var title = String(row[map.name] || "").trim() || "—";

    /* header: avatar, name + role, charge badge */
    var head = el("div", "chead");
    var av = el("div", "av");
    if (map.photo && isUrl(row[map.photo])) {
      var img = document.createElement("img");
      img.src = String(row[map.photo]).trim(); img.alt=""; img.loading="lazy";
      img.onerror = function(){ av.textContent = initials(title); };
      av.appendChild(img);
    } else av.textContent = initials(title);
    head.appendChild(av);

    var cid = el("div", "cid");
    cid.appendChild(el("div", "nm", title));
    if (map.role && row[map.role]) cid.appendChild(el("div", "role", row[map.role]));
    head.appendChild(cid);

    var rate = map.rate ? String(row[map.rate] || "").trim() : "";
    if (rate) head.appendChild(el("span", "rate", rate));
    c.appendChild(head);

    /* details: one line each, wrapped and labelled — never truncated */
    var place = map.place.map(function(k){ return row[k]; }).filter(Boolean).join(" · ");
    if (place) c.appendChild(el("div", "cdet", place));

    map.rest.forEach(function (k) {
      var v = String(row[k] || "").trim();
      if (!v) return;
      var d = el("div", "cdet");
      d.appendChild(el("b", null, k + ": "));
      d.appendChild(document.createTextNode(v));
      c.appendChild(d);
    });

    /* footer: the number in full, plus the tap targets */
    var nums = map.phone.map(function(k){ return String(row[k]||"").trim(); }).filter(Boolean);
    var mail = map.email ? String(row[map.email] || "").trim() : "";
    if (nums.length || mail) {
      var foot = el("div", "cfoot");
      if (nums.length) {
        var t = el("a", "tel", nums.join("  ·  "));
        t.href = tel(nums[0]);
        foot.appendChild(t);
      }
      var go = el("div", "go");
      if (nums.length) {
        var a = el("a", "iact call"); a.href = tel(nums[0]);
        a.title = "Call " + title; a.setAttribute("aria-label", "Call " + title);
        a.appendChild(svg(P.phone)); go.appendChild(a);
      }
      if (mail) {
        var m = el("a", "iact alt"); m.href = "mailto:" + mail;
        m.title = "Email " + title; m.setAttribute("aria-label", "Email " + title);
        m.appendChild(svg(P.mail)); go.appendChild(m);
      }
      foot.appendChild(go);
      c.appendChild(foot);
    }
    return c;
  }

  /* ---------------- side panel rows ---------------- */
  function sosRow(row, map) {
    var r = el("div", "prow");
    var name = String(row[map.name] || "—");
    r.appendChild(el("div", "pbadge", initials(name)));
    var i = el("div", "info");
    i.appendChild(el("div", "pname", name));
    var extra = map.rest.concat(map.place).map(function(k){return row[k];}).filter(Boolean).join(" · ");
    if (extra) i.appendChild(el("div", "pmeta", extra));
    var nums = map.phone.map(function(k){return String(row[k]||"").trim();}).filter(Boolean);
    if (nums.length) i.appendChild(el("div", "ptel", nums.join(" · ")));
    r.appendChild(i);
    if (nums.length) {
      var a = el("a", "iact call"); a.href = tel(nums[0]);
      a.setAttribute("aria-label", "Call " + name);
      a.style.background = "var(--alert)"; a.style.color = "#fff";
      a.appendChild(svg(P.phone)); r.appendChild(a);
    }
    return r;
  }
  function docRow(row, map) {
    var file = String(row[map.file] || "").trim();
    var r = el("div", "prow");
    r.appendChild(el("div", "pbadge", ext(file).slice(0,4)));
    var i = el("div", "info");
    i.appendChild(el("div", "pname", String(row[map.name] || file || "Document")));
    var meta2 = map.rest.concat(map.place).map(function(k){
      return k === map.file ? "" : row[k];
    }).filter(Boolean).join(" · ");
    if (meta2) i.appendChild(el("div", "pmeta", meta2));
    r.appendChild(i);
    if (file) {
      var go = el("div", "go");
      if (OFFICE.test(file) || INLINE.test(file)) {
        var v = el("a", "iact alt");
        v.href = OFFICE.test(file)
          ? "https://view.officeapps.live.com/op/view.aspx?src=" + encodeURIComponent(absUrl(file))
          : file;
        v.target = "_blank"; v.rel = "noopener";
        v.setAttribute("aria-label", "View");
        v.appendChild(svg(P.doc)); go.appendChild(v);
      }
      var d = el("a", "iact alt"); d.href = file; d.setAttribute("download","");
      d.setAttribute("aria-label", "Download");
      d.appendChild(svg(P.down)); go.appendChild(d);
      r.appendChild(go);
    }
    return r;
  }

  /* ---------------- chrome ---------------- */
  function chrome() {
    var name = meta.name || "Society Directory";
    document.title = name;
    document.getElementById("brandName").textContent = name;
    document.getElementById("footName").textContent = name;
    var ini = name.trim().charAt(0).toUpperCase();
    document.getElementById("brandDot").textContent = ini;
    document.getElementById("footDot").textContent = ini;
    if (meta.tagline) document.getElementById("heroEyebrow").textContent = meta.tagline;

    var h = document.getElementById("heroTitle");
    h.textContent = "";
    var parts = name.trim().split(/\s+/);
    var tail = parts.length > 1 ? parts.pop() : "";
    h.appendChild(document.createTextNode(parts.join(" ") + (tail ? " " : "")));
    if (tail) h.appendChild(el("span", "accent", tail));

    var addr = [meta.address, meta.city, meta.pincode].filter(Boolean).join(", ");
    document.getElementById("heroLede").textContent = addr
      ? addr + " — committee, emergency numbers, services, residents and documents."
      : "Committee, emergency numbers, services, residents and documents.";
    document.getElementById("footAddr").textContent = addr;
    document.getElementById("footReg").textContent = meta.registration ? "Reg. " + meta.registration : "";

    var st = document.getElementById("heroStats");
    st.textContent = "";
    sections.slice(0, 4).forEach(function (s) {
      var d = el("div", "stat");
      d.appendChild(el("div", "num", String(s.rows.length)));
      d.appendChild(el("div", "lbl", s.title));
      st.appendChild(d);
    });

    var nl = document.getElementById("navLinks"), fl = document.getElementById("footLinks");
    nl.textContent = ""; fl.textContent = "";
    sections.forEach(function (s) {
      var a = document.createElement("a");
      a.href = "#" + s.id; a.textContent = s.title; a.dataset.id = s.id;
      nl.appendChild(a);
      var f = document.createElement("a");
      f.href = "#" + s.id; f.textContent = s.title;
      fl.appendChild(f);
    });
    var sos = sections.filter(function(s){return s.sos;})[0];
    if (sos) {
      var cta = document.getElementById("sosCta");
      cta.hidden = false; cta.href = "#" + sos.id;
    }
    document.getElementById("searchbar").hidden = false;
  }

  /* ---------------- render ---------------- */
  function filtered(s, term) {
    if (!term) return s.rows;
    return s.rows.filter(function (r) {
      return s.cols.map(function(c){return r[c];})
        .filter(Boolean).join(" ").toLowerCase().indexOf(term) !== -1;
    });
  }
  function head(title, count, tag) {
    var h = el("div", "sec-head");
    h.appendChild(el("h2", null, title));
    h.appendChild(el("span", "n", String(count)));
    if (tag) h.appendChild(el("span", "tag", tag));
    return h;
  }

  function draw() {
    var term = qBox.value.trim().toLowerCase();
    mainEl.textContent = ""; sosEl.textContent = ""; docsEl.textContent = "";
    var total = 0;

    sections.forEach(function (s) {
      var rows = filtered(s, term);
      total += rows.length;

      if (s.sos) {                       // → sidebar, emergency panel
        if (!rows.length) return;
        var p = el("section", "panel alarm reveal");
        p.id = s.id;
        var t = el("h3"); t.appendChild(svg(P.alert)); t.appendChild(el("span", null, s.title));
        p.appendChild(t);
        p.appendChild(el("div", "cap", "Tap a number to call straight away"));
        rows.forEach(function (r) { p.appendChild(sosRow(r, s.map)); });
        sosEl.appendChild(p);
        return;
      }
      if (s.map.file) {                  // → sidebar, documents panel
        if (!rows.length) return;
        var d = el("section", "panel reveal");
        d.id = s.id;
        var t2 = el("h3"); t2.appendChild(svg(P.doc)); t2.appendChild(el("span", null, s.title));
        d.appendChild(t2);
        d.appendChild(el("div", "cap", rows.length + (rows.length === 1 ? " file" : " files") + " to view or download"));
        rows.forEach(function (r) { d.appendChild(docRow(r, s.map)); });
        docsEl.appendChild(d);
        return;
      }
      // → main column
      if (term && !rows.length) return;
      var sec = el("section", "sec reveal");
      sec.id = s.id;
      sec.appendChild(head(s.title, rows.length, null));
      var g = el("div", "cgrid");
      rows.forEach(function (r) { g.appendChild(contact(r, s.map, false)); });
      sec.appendChild(g);
      mainEl.appendChild(sec);
    });

    if (!total) {
      mainEl.appendChild(el("div", "empty",
        term ? "Nothing matches “" + qBox.value.trim() + "”." : "This directory is empty."));
    }
    reveals(); spy();
  }
  qBox.addEventListener("input", draw);

  function reveals() {
    var io = new IntersectionObserver(function (rows) {
      rows.forEach(function (r) {
        if (r.isIntersecting) { r.target.classList.add("in"); io.unobserve(r.target); }
      });
    }, { rootMargin: "0px 0px -6% 0px" });
    document.querySelectorAll(".reveal:not(.in)").forEach(function (n) { io.observe(n); });
  }
  function spy() {
    var links = document.querySelectorAll("#navLinks a");
    if (!links.length) return;
    var io = new IntersectionObserver(function (rows) {
      rows.forEach(function (r) {
        if (!r.isIntersecting) return;
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === r.target.id); });
      });
    }, { rootMargin: "-" + (60 + 60) + "px 0px -60% 0px" });
    document.querySelectorAll("section[id]").forEach(function (s) { io.observe(s); });
  }
  addEventListener("scroll", function () {
    var h = document.documentElement;
    var p = h.scrollTop / ((h.scrollHeight - h.clientHeight) || 1);
    document.getElementById("railFill").style.height = Math.min(100, p * 100) + "%";
  }, { passive: true });

  var toggle = document.getElementById("navToggle"), navLinks = document.getElementById("navLinks");
  toggle.onclick = function () {
    var open = navLinks.classList.toggle("open");
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  };
  navLinks.addEventListener("click", function (e) {
    if (e.target.tagName === "A") {
      navLinks.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
    }
  });
  document.getElementById("shareBtn").onclick = function () {
    if (location.protocol === "file:") {
      alert("This page is open as a local file. Publish it, then share the web address.");
      return;
    }
    var url = location.origin + location.pathname;
    if (navigator.share) { navigator.share({ title: document.title, url: url }).catch(function(){}); return; }
    navigator.clipboard.writeText(url)
      .then(function(){ alert("Link copied:\n" + url); })
      .catch(function(){ prompt("Copy this link:", url); });
  };

  function parse(buf) {
    var wb = XLSX.read(buf, { type: "array" });
    sections = []; meta = {};
    wb.SheetNames.forEach(function (name) {
      // A leading underscore marks data that is collected but never published:
      // dates of birth, landlord contacts, anything not for the noticeboard.
      if (name.charAt(0) === "_") return;

      var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval:"", raw:false })
        .filter(function (r) {
          return Object.keys(r).some(function (k) { return String(r[k]).trim() !== ""; });
        });
      if (!rows.length) return;
      var cols = Object.keys(rows[0]).filter(function (c) { return c.charAt(0) !== "_"; });
      if (!cols.length) return;
      if (/^(about|society|info|details|header)$/i.test(name) && cols.length >= 2) {
        rows.forEach(function (r) {
          var k = String(r[cols[0]]).toLowerCase().replace(/[^a-z]/g,"");
          var v = String(r[cols[1]]).trim();
          if (/^(societyname|name)$/.test(k)) meta.name = v;
          else if (/tagline|subtitle/.test(k)) meta.tagline = v;
          else if (/^address/.test(k)) meta.address = v;
          else if (/^city/.test(k)) meta.city = v;
          else if (/pin|zip/.test(k)) meta.pincode = v;
          else if (/^reg/.test(k)) meta.registration = v;
          else if (/logo/.test(k)) meta.logo = v;
        });
        return;
      }
      sections.push({
        id: slug(name), title: name, rows: rows, cols: cols,
        map: classify(cols), sos: /emerg|sos|urgent/i.test(name)
      });
    });
    if (!sections.length) throw new Error("No usable sheets found.");
    chrome(); draw();
    document.getElementById("footUpd").textContent =
      "Updated " + new Date().toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    if (location.hash) {
      var t = document.getElementById(location.hash.slice(1));
      if (t) setTimeout(function(){ t.scrollIntoView({behavior:"smooth",block:"start"}); }, 80);
    }
  }
  function fail(msg) {
    document.getElementById("heroTitle").textContent = "Society Directory";
    mainEl.textContent = "";
    var f = el("div", "fallback");
    f.appendChild(el("h2", null, "Couldn't load the directory"));
    var p = el("p", null, msg + " ");
    var a = document.createElement("a"); a.href = DATA_FILE; a.textContent = "Download the data file";
    p.appendChild(a); f.appendChild(p); mainEl.appendChild(f);
  }

  fetch(DATA_FILE + "?v=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
    .then(function (b) { parse(new Uint8Array(b)); })
    .catch(function (e) {
      fail(location.protocol === "file:"
        ? "Browsers block reading local files directly, so open the published address instead."
        : "Could not read " + DATA_FILE + " (" + (e.message || e) + ").");
    });
  reveals();
})();
</script>
</body>
</html>
